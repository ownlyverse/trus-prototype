<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이북 편집기 — 생각구독 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#FFFFFF; --ink:#121212; --sub:#666666; --line:#E5E5E5;
  --blue:#00B8FF; --blue-d:#067CAF; --blue-dd:#045D84; --blue-soft:#E5F7FF;
  --canvas:#E9E6E0; --warn:#C93A2E; --warn-soft:#FBEBE9;
  --sheet-w:min(720px, 92vw); --pad-y:48px; --pad-x:44px; --sheet-gap:28px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--paper); color:var(--ink); letter-spacing:-0.01em; word-break:keep-all;
  display:flex; flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
.serif{letter-spacing:-0.02em}
:focus-visible{outline:3px solid #3182F6; outline-offset:2px}

/* ── 상단바 ── */
.bar{display:flex; align-items:center; gap:10px; padding:11px 18px; background:#fff;
  border-bottom:1px solid var(--line); flex-shrink:0; position:relative; z-index:40}
.back{font-size:.88rem; font-weight:700; color:var(--sub); padding:8px 10px; border-radius:9px; white-space:nowrap}
.back:hover{background:#F0F0F0; color:var(--ink)}
.bar .book{display:flex; align-items:center; gap:10px; margin:0 auto; min-width:0; position:relative}
.bt-btn{display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius:9px; min-width:0}
.bt-btn:hover{background:#F0F0F0}
.bt-btn .bt{font-size:.98rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bt-btn .car{font-size:.6rem; color:var(--sub)}
.bar .tag{font-size:.7rem; font-weight:800; padding:4px 10px; border-radius:7px; background:var(--blue-soft);
  color:var(--blue-dd); flex-shrink:0}
.bar .spacer{flex:1}
.issue-badge{font-size:.64rem; font-weight:800; letter-spacing:.12em; padding:4px 9px; border-radius:6px;
  background:var(--blue-dd); color:#fff; flex-shrink:0}
.bar .bt{max-width:32vw}
.bar .stat{font-size:.78rem; color:var(--sub); white-space:nowrap}
.btn-ghost{font-size:.84rem; font-weight:800; padding:9px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff}
.btn-ghost:hover{border-color:var(--ink)}
.btn-pub{font-size:.84rem; font-weight:800; color:#fff; background:var(--blue-d); padding:9px 16px; border-radius:10px;
  transition:background .12s}
.btn-pub:hover{background:var(--blue-dd)}
.m-toc{display:none; font-size:.88rem; font-weight:700; padding:8px 10px; border-radius:9px; color:var(--sub)}

/* ── 우측 편집 패널 ── */
.rside{width:264px; flex-shrink:0; border-left:1px solid var(--line); background:#FAFAFA;
  overflow-y:auto; padding:16px 16px 46px}
.rside .ps{border-bottom:1px solid var(--line); padding:15px 0}
.rside .ps:first-child{padding-top:0}
.rside .pt{font-size:.72rem; font-weight:800; color:var(--sub); letter-spacing:.08em; margin:0 0 4px}
.rside .fl{font-size:.72rem; font-weight:800; color:var(--sub); letter-spacing:.05em; margin:12px 0 5px}
.rside input[type=text]{width:100%; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; font-size:.9rem; background:#fff}
.rside input[type=text]:focus{outline:none; border-color:var(--blue-d)}
.rside .hintp{font-size:.76rem; color:var(--sub); line-height:1.6; margin-top:6px}
.rside .row{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
.tgl{font-size:.78rem; font-weight:700; padding:7px 10px; border-radius:8px; border:1.5px solid var(--line); background:#fff}
.tgl:hover{border-color:var(--ink)}
.tgl.on{background:var(--blue-soft); border-color:var(--blue-d); color:var(--blue-dd)}
.segrow{display:flex; gap:5px; margin-top:6px}
.segrow .tgl{flex:1; text-align:center; padding:7px 4px; justify-content:center; display:flex}
.props-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px}
.props-head .done{font-size:.74rem; font-weight:700; color:var(--sub); padding:5px 8px; border-radius:7px}
.props-head .done:hover{background:#EFEDEA; color:var(--ink)}
.cov-row{display:flex; align-items:center; gap:10px}
.cov-thumb{width:52px; height:73px; border-radius:6px; border:1px solid var(--line); object-fit:cover; background:var(--canvas)}
.cov-none{width:52px; height:73px; border-radius:6px; border:1.5px dashed var(--line); display:flex; align-items:center;
  justify-content:center; font-size:.65rem; color:var(--sub); text-align:center}
.cov-row{margin-top:2px}
.mini{font-size:.78rem; font-weight:700; padding:7px 10px; border-radius:8px; border:1.5px solid var(--line); background:#fff}
.mini:hover{border-color:var(--ink)}
.mini.danger{color:var(--warn)}
.mini.danger:hover{border-color:var(--warn); background:var(--warn-soft)}

/* ── 본문 레이아웃 ── */
.body{display:flex; flex:1; min-height:0}
.side{width:250px; flex-shrink:0; border-right:1px solid var(--line); background:#FAFAFA;
  display:flex; flex-direction:column; overflow-y:auto}
.side .sh{font-size:.72rem; font-weight:800; color:var(--sub); letter-spacing:.08em; padding:18px 18px 10px}
.chap{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:11px 10px 11px 18px;
  font-size:.88rem; border-left:3px solid transparent; position:relative; cursor:pointer}
.chap:hover{background:#F0F0F0}
.chap.on{background:#fff; border-left-color:var(--blue-d); font-weight:700}
.chap .no{font-size:.7rem; color:var(--blue-d); font-weight:700; flex-shrink:0}
.chap .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.chap .ops{display:none; gap:2px; flex-shrink:0}
.chap:hover .ops, .chap:focus-within .ops{display:flex}
.chap .ops button{width:24px; height:24px; border-radius:6px; font-size:.72rem; color:var(--sub); display:flex; align-items:center; justify-content:center}
.chap .ops button:hover:not(:disabled){background:#E2E2E2; color:var(--ink)}
.chap .ops button:disabled{opacity:.25; cursor:not-allowed}
.add-chap{margin:10px 14px 20px; padding:11px; font-size:.84rem; font-weight:700; color:var(--sub);
  border:1.5px dashed var(--line); border-radius:11px}
.add-chap:hover{color:var(--blue-dd); border-color:var(--blue-d)}

/* ── 에디터(캔버스) ── */
.editor{flex:1; overflow-y:auto; background:var(--canvas); padding:34px 20px 110px}
.chead{max-width:var(--sheet-w); margin:0 auto 26px}
.title-in{width:100%; font-size:1.55rem; font-weight:900; color:var(--ink); border:none; background:none;
  letter-spacing:-0.02em; padding:4px 2px 10px; border-bottom:1px solid transparent}
.title-in:hover{border-bottom-color:#CFCCC5}
.title-in:focus{outline:none; border-bottom-color:var(--blue-d)}
.crow{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap}
.tag-in{border:1.5px solid transparent; border-radius:8px; padding:6px 9px; font-size:.82rem; font-weight:700;
  background:rgba(255,255,255,.6); width:180px}
.tag-in:hover{border-color:#CFCCC5}
.tag-in:focus{outline:none; border-color:var(--blue-d); background:#fff}
.voice-add{font-size:.8rem; font-weight:700; color:var(--sub); padding:7px 10px; border-radius:8px;
  border:1.5px dashed #CFCCC5}
.voice-add:hover{color:var(--blue-dd); border-color:var(--blue-d)}
.voice-bar{display:flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:6px 8px 6px 6px; font-size:.8rem; font-weight:700}
.voice-bar .vp{width:26px; height:26px; border-radius:50%; background:var(--blue-d); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.62rem; flex-shrink:0}
.voice-bar .vd{color:var(--sub); font-weight:600}
.voice-bar .vx{color:var(--sub); font-size:.72rem; padding:4px 6px; border-radius:6px}
.voice-bar .vx:hover{background:#F0F0F0; color:var(--ink)}
.voice-form{display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:#fff; border:1px solid var(--line);
  border-radius:11px; padding:8px}
.voice-form input{border:1.5px solid var(--line); border-radius:8px; padding:6px 9px; font-size:.8rem; background:#fff}
.voice-form input:focus{outline:none; border-color:var(--blue-d)}
.voice-form .vlab{width:190px}
.voice-form .vdur{width:64px}
.voice-form .verr{font-size:.72rem; color:var(--warn); font-weight:700; width:100%}

/* ── 대지 ── */
.swrap{position:relative; width:var(--sheet-w); margin:0 auto var(--sheet-gap)}
.sh-no{position:absolute; top:-22px; left:2px; font-size:.68rem; font-weight:800; color:#A9A49B; letter-spacing:.08em}
.sh-tools{position:absolute; top:-26px; right:0; display:none; gap:6px}
.swrap:hover .sh-tools{display:flex}
.sh-tools button{font-size:.72rem; font-weight:700; color:var(--sub); background:rgba(255,255,255,.9);
  border:1px solid var(--line); border-radius:7px; padding:4px 8px}
.sh-tools button:hover:not(:disabled){color:var(--ink); border-color:var(--ink)}
.sh-tools button:disabled{opacity:.35; cursor:not-allowed}
.sheet{background:#fff; aspect-ratio:210/297; box-shadow:0 1px 2px rgba(0,0,0,.12), 0 10px 28px rgba(0,0,0,.07); position:relative}
.sh-in{height:100%; padding:var(--pad-y) var(--pad-x); overflow:hidden; cursor:text}
.swrap.over .sheet{outline:2px solid var(--warn)}
.over-badge{display:none; position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
  background:var(--warn); color:#fff; font-size:.7rem; font-weight:800; padding:4px 11px; border-radius:999px;
  white-space:nowrap; z-index:5}
.swrap.over .over-badge{display:block}
.add-sheet{display:block; width:var(--sheet-w); margin:0 auto; padding:13px; font-size:.86rem; font-weight:700;
  color:var(--sub); border:1.5px dashed #C9C5BD; border-radius:12px; background:rgba(255,255,255,.4)}
.add-sheet:hover{color:var(--blue-dd); border-color:var(--blue-d)}

/* ── 블록 ── */
.blk{position:relative; cursor:text}
/* 왼쪽 여백까지 hover 영역 확장 — 핸들로 가는 길에 틈이 없게 */
.blk::before{content:""; position:absolute; left:calc(-1*var(--pad-x)); top:0; bottom:0; width:var(--pad-x)}
.blk-h{position:absolute; left:calc(-1*var(--pad-x) + 7px); top:0; display:none; flex-direction:column; gap:1px; z-index:6}
.blk:hover > .blk-h, .blk:focus-within > .blk-h, .blk.sel > .blk-h{display:flex}
.blk-h button{width:24px; height:24px; border-radius:6px; font-size:.68rem; color:#98938A; background:#fff;
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center}
.blk-h button:hover{color:var(--ink); border-color:var(--ink)}
.blk-h button.del:hover{color:var(--warn); border-color:var(--warn)}
[contenteditable]{cursor:text}
[contenteditable]:focus{outline:none}
[data-ph]:empty::before{content:attr(data-ph); color:#B6B2AA; pointer-events:none}

.bp{font-size:.98rem; line-height:1.92; color:#212121; padding:2px 0; min-height:1.9em}
.bp b{font-weight:800}
/* 글자 서식 (발행 시 리더기에도 동일 클래스로 렌더) */
.tc-b{color:var(--blue-dd)}
.tc-p{color:#ED2390}
.hl-y{background:linear-gradient(180deg, transparent 55%, rgba(242,197,61,.55) 55%)}
.fs-sm{font-size:.85em}
.fs-lg{font-size:1.22em}
.bh{padding:6px 0 10px}
.bh-en{font-size:1.5rem; font-weight:800; line-height:1.18; letter-spacing:-0.02em; color:var(--ink);
  font-family:Georgia,"Times New Roman",serif; white-space:pre-line; min-height:1.2em}
.bh-ko{font-size:.94rem; font-weight:700; color:var(--blue-dd); margin-top:8px; white-space:pre-line; min-height:1.4em}
.bv{font-size:.96rem; line-height:2.05; text-align:center; white-space:pre-line; padding:14px 8px; color:#333; min-height:2em}
/* 조판 모디파이어 — 발행 시 리더기에도 같은 클래스로 전달 (.bp/.bv 뒤에 둬서 우선) */
.al-l{text-align:left}
.al-c{text-align:center}
.al-r{text-align:right}
.lh-sm{line-height:1.6}
.lh-lg{line-height:2.3}
.ls-sm{letter-spacing:-.03em}
.ls-lg{letter-spacing:.06em}
.bd{text-align:center; color:#B9B4AB; font-size:.7rem; padding:12px 0; cursor:default}
.bct{font-size:1.5rem; font-weight:900; letter-spacing:-.02em; line-height:1.35; padding:4px 0 10px; min-height:1.4em}
.blk.sel{outline:2px solid var(--blue-d); outline-offset:5px; border-radius:2px}
.plabel{display:inline-block; font-size:.6rem; font-weight:800; letter-spacing:.12em; color:var(--blue-dd);
  background:var(--blue-soft); border-radius:5px; padding:2px 7px; margin-bottom:4px}
.bsplit{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:center; margin:6px 0}
.bsplit .bh-en{font-size:1.22rem}
.bsplit .ph{margin:0}
.bsplit .ph img{height:220px; max-height:none}
.bsplit .ph-empty{height:220px; margin:0}
.bcover{margin:6px calc(-1*var(--pad-x))}
.bcover .ph{margin:0}
.bcover .ph img{max-height:430px; height:430px}
.bcover-note{font-size:.68rem; color:#A9A49B; text-align:center; padding:4px 0 0}
.btitle{padding:44px 0 34px; text-align:center}
.btitle .bt1{font-size:.78rem; letter-spacing:.24em; font-weight:700; color:var(--sub); white-space:pre-line; min-height:1.2em}
.btitle .bt2{font-size:1.65rem; letter-spacing:.08em; font-weight:800; margin-top:14px;
  font-family:Georgia,"Times New Roman",serif; white-space:pre-line; min-height:1.3em}
.btoc{padding:10px 0}
.btoc-i{display:flex; gap:12px; align-items:baseline; padding:9px 2px; border-bottom:1px solid var(--line); font-size:.95rem; font-weight:600}
.btoc-no{font-size:.7rem; font-weight:800; color:var(--blue-d); letter-spacing:.08em}
.btoc-note{font-size:.68rem; color:#A9A49B; text-align:center; padding:10px 0 0}
.ph{position:relative; margin:6px 0}
.ph img{display:block; width:100%; max-height:340px; object-fit:cover}
.blk.bleed .ph{margin-left:calc(-1*var(--pad-x)); margin-right:calc(-1*var(--pad-x))}
.blk.bleed .ph img{max-height:380px}
.ph-tools{position:absolute; top:8px; right:8px; display:none; gap:6px}
.ph:hover .ph-tools{display:flex}
.ph-tools button{font-size:.72rem; font-weight:700; background:rgba(17,17,17,.78); color:#fff;
  border-radius:7px; padding:5px 9px}
.ph-tools button:hover{background:rgba(17,17,17,.95)}
.ph-empty{display:flex; align-items:center; justify-content:center; width:100%; height:150px; margin:6px 0;
  border:1.5px dashed #C9C5BD; border-radius:10px; color:var(--sub); font-size:.84rem; font-weight:700}
.ph-empty:hover{color:var(--blue-dd); border-color:var(--blue-d)}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0}
.duo .ph, .duo .ph-empty{margin:0}
.duo .ph img{height:170px; max-height:none}
.vid{margin:8px 0}
.vid .vframe{position:relative; width:100%; aspect-ratio:16/9; background:#111}
.vid iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.vid .vnote{font-size:.8rem; color:var(--sub); padding:7px 2px 0; min-height:1.5em}
.vid .vtools{display:flex; justify-content:flex-end; padding-top:4px}
.vid .vtools button{font-size:.72rem; font-weight:700; color:var(--sub); padding:4px 8px; border-radius:6px}
.vid .vtools button:hover{background:rgba(0,0,0,.05); color:var(--ink)}
.vform{display:flex; gap:7px; align-items:center; flex-wrap:wrap; border:1.5px dashed #C9C5BD;
  border-radius:10px; padding:12px; margin:6px 0}
.vform input{flex:1; min-width:180px; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-size:.84rem; background:#fff}
.vform input:focus{outline:none; border-color:var(--blue-d)}
.vform .go{font-size:.8rem; font-weight:800; color:#fff; background:var(--blue-d); border-radius:8px; padding:8px 13px}
.vform .go:hover{background:var(--blue-dd)}
.vform .verr{font-size:.74rem; color:var(--warn); font-weight:700; width:100%}

/* ── 삽입 가드(+) ── */
.igap{height:12px; position:relative; cursor:default}
.igap .iplus{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:24px; height:24px;
  border-radius:50%; background:var(--blue-d); color:#fff; font-size:.86rem; line-height:1;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .1s; z-index:5; cursor:pointer}
.igap::after{content:""; position:absolute; left:0; right:0; top:50%; height:1.5px; background:var(--blue-d);
  opacity:0; transition:opacity .1s}
.igap:hover .iplus, .igap:hover::after, .igap .iplus:focus-visible{opacity:1}
.empty-sheet{display:flex; align-items:center; justify-content:center; height:100%}
.empty-sheet button{font-size:.9rem; font-weight:700; color:var(--sub); border:1.5px dashed #C9C5BD;
  border-radius:11px; padding:13px 22px; cursor:pointer}
.empty-sheet button:hover{color:var(--blue-dd); border-color:var(--blue-d)}

/* ── 글자 포맷 툴바 ── */
.fmt{position:fixed; z-index:95; background:rgba(17,17,17,.94); border-radius:11px; padding:5px;
  display:none; gap:2px; align-items:center; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.fmt.open{display:flex}
.fmt button{min-width:28px; height:28px; border-radius:7px; color:#EEE; font-size:.78rem; font-weight:800;
  display:flex; align-items:center; justify-content:center; padding:0 7px}
.fmt button:hover{background:rgba(255,255,255,.16)}
.fmt .sw{width:14px; height:14px; border-radius:4px; display:inline-block}
.fmt .sep{width:1px; height:16px; background:rgba(255,255,255,.22); margin:0 3px}

/* ── 요소 라이브러리 ── */
.elg{font-size:.68rem; font-weight:800; color:#A9A49B; letter-spacing:.08em; margin:12px 0 6px}
.elgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.elbtn{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; border:1.5px solid var(--line);
  background:#fff; font-size:.8rem; font-weight:700; text-align:left}
.elbtn:hover{border-color:var(--blue-d); color:var(--blue-dd)}
.elbtn .pi{width:22px; height:22px; border-radius:6px; background:#F2F0EC; display:flex; align-items:center;
  justify-content:center; font-size:.62rem; font-weight:800; color:var(--sub); flex-shrink:0}

/* ── 책 만들기 모달 ── */
.bdim{position:fixed; inset:0; z-index:110; background:rgba(20,18,16,.45); display:none;
  align-items:center; justify-content:center; padding:20px}
.bdim.open{display:flex}
.bmodal{width:min(400px, 94vw); background:#fff; border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.3);
  padding:26px 24px; max-height:90vh; overflow-y:auto}
.bmodal h2{font-size:1.15rem; font-weight:900; margin-bottom:4px}
.bmodal .msub{font-size:.8rem; color:var(--sub); margin-bottom:14px}
.bmodal .fl{font-size:.72rem; font-weight:800; color:var(--sub); letter-spacing:.05em; margin:12px 0 5px}
.bmodal input[type=text]{width:100%; border:1.5px solid var(--line); border-radius:9px; padding:10px 12px; font-size:.92rem}
.bmodal input[type=text]:focus{outline:none; border-color:var(--blue-d)}
.bmodal .mrow{display:flex; gap:8px; margin-top:18px}
.bmodal .go{flex:1; font-size:.9rem; font-weight:800; color:#fff; background:var(--blue-d); border-radius:11px; padding:12px}
.bmodal .go:hover{background:var(--blue-dd)}
.bmodal .alt{width:100%; margin-top:9px; font-size:.78rem; font-weight:700; color:var(--sub); padding:7px}
.bmodal .alt:hover{color:var(--ink)}

/* ── 팔레트 ── */
.palette{position:fixed; z-index:90; background:#fff; border:1px solid var(--line); border-radius:13px;
  box-shadow:0 16px 44px rgba(0,0,0,.16); padding:7px; display:none; width:200px}
.palette.open{display:block}
.palette button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px;
  border-radius:9px; font-size:.86rem; font-weight:600}
.palette button:hover{background:var(--blue-soft)}

<script>
/* ═══════════ 목데이터 (리더기와 동일한 BOOK — 두 파일에 복붙 공유) ═══════════ */
function svgPh(label, bg){

function mockBook(){
  return {
    v: 2,

    title: '경계 세우는 연습',

      { id:'ch1', tag:'', title:'1. 거절에도 예의가 있다',

            { t:'p', html:'거절을 미루는 것은 배려가 아니라 유예다. 대답을 미루는 동안 상대는 계획을 세우지 못하고, 나는 마음의 빚을 키운다. 상대의 시간을 아끼는 가장 정중한 방법은, <span class="hl-y">빠르고 분명하게 말하는 것이다.</span>' },
            { t:'p', html:'분명한 거절에는 세 가지가 담긴다. 요청을 이해했다는 확인, 들어줄 수 없다는 결론, 그리고 가능하다면 대안. 이 셋이 갖춰지면 거절은 관계를 상하게 하지 않는다. 오히려 다음 부탁을 쉽게 만든다.' }
          ]},
          { blocks:[
            { t:'p', html:'거절이 어려운 이유는 대개 상대 때문이 아니라 나 때문이다. 좋은 사람으로 남고 싶은 마음이, 좋은 관계를 만드는 일을 방해한다.' },

        ]},

        sheets:[
          { blocks:[
            { t:'ctitle', text:'2. 경계는 벽이 아니라 문이다' },
            { t:'photo', src:svgPh('사진 예시', '#D8D4CC'), bleed:false },
            { t:'p', html:'경계를 세운다는 말은 관계를 끊는다는 뜻이 아니다. 담장 없는 집에는 손님이 오지 않는다. 어디까지가 마당이고 어디부터가 거실인지 모르기 때문이다. 문이 있는 집이 손님을 더 잘 맞이하듯, 경계가 있는 사람이 관계를 더 오래 지킨다.' },
            { t:'p', html:'경계는 선언이 아니라 반복으로 세워진다. 한 번의 큰 선언보다, 작은 요청에 일관되게 반응하는 편이 낫다. "퇴근 후에는 답장이 늦어요"를 열 번 지키는 것이, "연락하지 마세요"를 한 번 말하는 것보다 강하다.' }

        sheets:[
          { blocks:[
            { t:'ctitle', text:'3. 관계를 남기는 말투' },
            { t:'p', html:'같은 거절도 말투에 따라 관계를 남기기도, 끝내기도 한다. 원칙은 하나다. <b>내용은 단호하게, 형식은 다정하게.</b>' },
            { t:'divider' },
            { t:'p', html:'단호한 내용이 없으면 거절이 아니라 흥정이 되고, 다정한 형식이 없으면 거절이 아니라 단절이 된다. 이 둘은 반대말이 아니라 한 문장의 앞뒤다.' }
          ]},
          { blocks:[
            { t:'duo', srcs:[svgPh('사진 1', '#D8D4CC'), svgPh('사진 2', '#CCD2D8')] },

}

/* ═══════════ 저장 계약 ═══════════
   trus_ebook_draft     — 작업 중 자동 임시저장 (편집기 전용)
   trus_ebook_published — 발행 스냅샷 (리더기가 기본으로 읽음)
   trus_ebook_preview   — 미리보기 스냅샷 (리더기 ?preview=1) */
const K_DRAFT = 'trus_ebook_draft';
const K_PUB   = 'trus_ebook_published';
const K_PREV  = 'trus_ebook_preview';

const $ = id => document.getElementById(id);

function loadKey(key){
  try{
    const d = JSON.parse(localStorage.getItem(key));
    if(d && d.v === 2 && Array.isArray(d.chapters) && d.chapters.length) return d;
  }catch(e){}
  return null;
}
function saveKey(key, failMsg){
  try{ localStorage.setItem(key, JSON.stringify(BOOK)); return true; }
  catch(e){ toast(failMsg || '저장 실패 — 브라우저 저장 공간을 확인할 것'); return false; }
}

const _draft = loadKey(K_DRAFT);
let BOOK = _draft || mockBook();
let cur = 0;
let lastSaved = null;

/* ═══════════ 유틸 ═══════════ */
function escHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 허용 태그: b/i/br + 서식 span(클래스 화이트리스트). div·p 등 블록 경계는 <br>로 변환.
   execCommand 가 만드는 font[color/size]·style 색은 아는 값이면 클래스로 변환, 모르면 벗긴다. */
const FMT_CLASSES = ['tc-b', 'tc-p', 'hl-y', 'fs-sm', 'fs-lg'];
const COLOR_MAP = {
  '#067caf':'tc-b', 'rgb(6, 124, 175)':'tc-b',
  '#ed2390':'tc-p', 'rgb(237, 35, 144)':'tc-p',
  '#f2c53d':'hl-y', 'rgb(242, 197, 61)':'hl-y'
};
function fmtClassesOf(n){
  const out = [];
  (n.getAttribute('class') || '').split(/\s+/).forEach(c => { if(FMT_CLASSES.includes(c)) out.push(c); });
  const st = n.getAttribute('style') || '';
  const fc = n.getAttribute('color') || ((st.match(/(?:^|;)\s*color:\s*([^;]+)/i) || [])[1] || '').trim();
  if(fc && COLOR_MAP[fc.toLowerCase()] && COLOR_MAP[fc.toLowerCase()][0] === 't') out.push(COLOR_MAP[fc.toLowerCase()]);
  const bc = ((st.match(/background(?:-color)?:\s*([^;]+)/i) || [])[1] || '').trim();
  if(bc && COLOR_MAP[bc.toLowerCase()] === 'hl-y') out.push('hl-y');
  const sz = n.getAttribute('size');
  if(sz){ if(+sz <= 2) out.push('fs-sm'); else if(+sz >= 5) out.push('fs-lg'); }
  return [...new Set(out)];
}
function sanitizeHtml(html){
  const t = document.createElement('div');
  t.innerHTML = String(html ?? '');
  let out = '';
  (function walk(node){
    node.childNodes.forEach(n => {
      if(n.nodeType === 3){ out += escHtml(n.nodeValue); return; }
      if(n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if(tag === 'br'){ out += '<br>'; }
      else if(tag === 'b' || tag === 'strong'){ out += '<b>'; walk(n); out += '</b>'; }
      else if(tag === 'i' || tag === 'em'){ out += '<i>'; walk(n); out += '</i>'; }
      else if(tag === 'span' || tag === 'font'){
        const cls = fmtClassesOf(n);
        if(cls.length){ out += `<span class="${cls.join(' ')}">`; walk(n); out += '</span>'; }
        else walk(n);
      }
      else { walk(n); if(/^(div|p|li|h[1-6]|tr|blockquote)$/.test(tag)) out += '<br>'; }
    });
  })(t);
  return out.replace(/(<br>)+$/, '');
}
function parseYouTube(url){
  const m = String(url || '').match(
    /(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] : null;
}
function chap(){ return BOOK.chapters[cur]; }
function pad2(n){ return String(n).padStart(2, '0'); }
function uid(){ return 'ch' + Math.random().toString(36).slice(2, 9); }

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ═══════════ 인라인 확인 (confirm() 대신 화면 안 UI) ═══════════ */
let askCb = null;
let askGuard = false; /* 여는 클릭이 document까지 버블링돼 즉시 닫히는 것 방지 */
function ask(anchor, text, yesLabel, danger, cb){
  askGuard = true; setTimeout(() => { askGuard = false; }, 0);
  const a = $('ask');
  $('askText').textContent = text;
  const yes = $('askYes');
  yes.textContent = yesLabel;
  yes.classList.toggle('danger', !!danger);
  askCb = cb;
  a.classList.add('open');
  const r = anchor.getBoundingClientRect();
  a.style.left = '0px'; a.style.top = '0px';
  const w = a.offsetWidth, h = a.offsetHeight;
  const x = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  let y = r.bottom + 8;
  if(y + h > window.innerHeight - 8) y = r.top - h - 8;
  a.style.left = x + 'px'; a.style.top = Math.max(8, y) + 'px';
  yes.focus();
}
function closeAsk(){ $('ask').classList.remove('open'); askCb = null; }

/* ═══════════ 저장 상태 ═══════════ */
let dirtyTimer = null;
function fmtAgo(){
  if(!lastSaved) return '';
  const m = Math.floor((Date.now() - lastSaved) / 60000);
  return m < 1 ? '방금' : m + '분 전';
}
function refreshStat(){
  if(lastSaved) $('stat').textContent = '임시저장됨 · ' + fmtAgo();
}
setInterval(refreshStat, 30000);
function markDirty(){
  $('stat').textContent = '수정 중…';
  clearTimeout(dirtyTimer);
  dirtyTimer = setTimeout(() => {
    if(saveKey(K_DRAFT)){ lastSaved = Date.now(); refreshStat(); }
    else { $('stat').textContent = '저장 실패'; }
  }, 1200);
}

/* ═══════════ 렌더 ═══════════ */
function renderChapList(){
  $('chapList').innerHTML = BOOK.chapters.map((c, i) => `
    <div class="chap${i===cur?' on':''}" role="button" tabindex="0" data-ci="${i}">
      <span class="no">${pad2(i+1)}</span><span class="t">${escHtml(c.title) || '(제목 없음)'}</span>
      <span class="ops">
        <button data-cop="up" data-ci="${i}" title="위로" aria-label="챕터 위로" ${i===0?'disabled':''}>↑</button>
        <button data-cop="down" data-ci="${i}" title="아래로" aria-label="챕터 아래로" ${i===BOOK.chapters.length-1?'disabled':''}>↓</button>
        <button data-cop="del" data-ci="${i}" title="삭제" aria-label="챕터 삭제" ${BOOK.chapters.length<2?'disabled':''}>✕</button>
      </span>
    </div>`).join('');
}

function renderChapHead(){
  const v = chap().voice;
  let vHtml;
  if(chap()._voiceEdit){
    vHtml = `<div class="voice-form">
      <input class="vlab" id="vLab" value="${escHtml(v ? v.label : '작가가 이 장을 여는 말')}" aria-label="여는 말 라벨">
      <input class="vdur" id="vDur" value="${escHtml(v ? v.dur : '')}" placeholder="1:12" aria-label="재생시간">
      <button class="mini" id="vSave">저장</button>
      <button class="mini" id="vCancel">취소</button>
      <span class="verr" id="vErr"></span>
    </div>`;
  } else if(v){
    vHtml = `<div class="voice-bar"><span class="vp">▶</span>${escHtml(v.label)}
      <span class="vd">${escHtml(v.dur)}</span>
      <button class="vx" id="vEdit" aria-label="여는 말 수정">수정</button>
      <button class="vx" id="vDel" aria-label="여는 말 삭제">삭제</button></div>`;
  } else {
    vHtml = `<button class="voice-add" id="vAdd">+ 여는 말 추가</button>`;
  }
  $('crow').innerHTML = vHtml;
  const bind = (id, fn) => { const el = $(id); if(el) el.addEventListener('click', fn); };
  bind('vAdd', () => { chap()._voiceEdit = true; renderChapHead(); });
  bind('vEdit', () => { chap()._voiceEdit = true; renderChapHead(); });
  bind('vDel', () => { chap().voice = null; markDirty(); renderChapHead(); });
  bind('vCancel', () => { delete chap()._voiceEdit; renderChapHead(); });
  bind('vSave', () => {
    const lab = $('vLab').value.trim() || '작가가 이 장을 여는 말';
    const dur = $('vDur').value.trim();
    if(!/^\d{1,2}:\d{2}$/.test(dur)){ $('vErr').textContent = '시간 형식: 분:초 (예 1:12)'; return; }
    chap().voice = { label: lab, dur };
    delete chap()._voiceEdit;
    markDirty(); renderChapHead();
  });
}

/* 블록 조판 클래스 (기본값이면 빈 문자열) — 편집 캔버스·발행 공용 */
function fmtCls(b){
  let c = '';
  if(b.align === 'c') c += ' al-c'; else if(b.align === 'r') c += ' al-r';
  if(b.lh === 's') c += ' lh-sm'; else if(b.lh === 'l') c += ' lh-lg';
  if(b.ls === 's') c += ' ls-sm'; else if(b.ls === 'l') c += ' ls-lg';
  return c;
}
function igapHTML(si, bi){
  return `<div class="igap"><button class="iplus" data-act="plus" data-si="${si}" data-bi="${bi}" aria-label="블록 추가">＋</button></div>`;
}
function phFigure(src, tools){
  return `<figure class="ph"><img src="${src}" alt="본문 사진">${tools}</figure>`;
}
function blkHTML(b, si, bi){
  const h = `<span class="blk-h">
    <button data-act="up" data-si="${si}" data-bi="${bi}" title="위로" aria-label="블록 위로">↑</button>
    <button data-act="down" data-si="${si}" data-bi="${bi}" title="아래로" aria-label="블록 아래로">↓</button>
    <button data-act="dup" data-si="${si}" data-bi="${bi}" title="복제" aria-label="블록 복제">⧉</button>
    <button class="del" data-act="del" data-si="${si}" data-bi="${bi}" title="삭제" aria-label="블록 삭제">✕</button>
  </span>`;
  let body = '';
  if(b.t === 'ctitle'){
    body = `<div class="bct" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="text" data-ph="챕터 제목">${escHtml(b.text)}</div>`;
  } else if(b.t === 'p'){
    body = `${(b.label || '').trim() ? `<span class="plabel">${escHtml(b.label)}</span>` : ''}<div class="bp${fmtCls(b)}" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="html" data-ph="내용 입력">${sanitizeHtml(b.html)}</div>`;
  } else if(b.t === 'head'){
    body = `<div class="bh">
      <div class="bh-en" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="en" data-ph="ENGLISH COPY">${escHtml(b.en)}</div>
      <div class="bh-ko" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="ko" data-ph="한글 카피">${escHtml(b.ko)}</div>
    </div>`;
  } else if(b.t === 'verse'){
    body = `<div class="bv${fmtCls(b)}" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="text" data-ph="인용·운문 입력">${escHtml(b.text)}</div>`;
  } else if(b.t === 'divider'){
    body = `<div class="bd">◆</div>`;
  } else if(b.t === 'photo'){
    body = b.src
      ? phFigure(b.src, `<div class="ph-tools">
          <button data-act="ph-change" data-si="${si}" data-bi="${bi}">사진 변경</button>
          <button data-act="ph-bleed" data-si="${si}" data-bi="${bi}">${b.bleed ? '여백 살리기' : '여백 채움'}</button>
        </div>`)
      : `<button class="ph-empty" data-act="ph-change" data-si="${si}" data-bi="${bi}">사진 선택</button>`;
  } else if(b.t === 'duo'){
    body = `<div class="duo">` + [0, 1].map(k => b.srcs[k]
      ? phFigure(b.srcs[k], `<div class="ph-tools"><button data-act="duo-change" data-si="${si}" data-bi="${bi}" data-slot="${k}">사진 변경</button></div>`)
      : `<button class="ph-empty" data-act="duo-change" data-si="${si}" data-bi="${bi}" data-slot="${k}">사진 선택</button>`
    ).join('') + `</div>`;
  } else if(b.t === 'video'){
    const emb = parseYouTube(b.url);
    body = emb
      ? `<div class="vid"><div class="vframe"><iframe src="${emb}" title="본문 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
         <div class="vnote" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="note" data-ph="영상 안내문 (선택)">${escHtml(b.note || '')}</div>
         <div class="vtools"><button data-act="v-reset" data-si="${si}" data-bi="${bi}">URL 변경</button></div></div>`
      : `<div class="vform">
          <input type="url" id="vurl-${si}-${bi}" value="${escHtml(b.url || '')}" placeholder="유튜브 URL (watch·youtu.be·shorts)" aria-label="유튜브 URL">
          <button class="go" data-act="v-embed" data-si="${si}" data-bi="${bi}">임베드</button>
          ${b._err ? `<span class="verr">유튜브 주소 형식이 아닙니다</span>` : ''}
        </div>`;
  }
  else if(b.t === 'split'){
    body = `<div class="bsplit">
      <div>
        <div class="bh-en" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="en" data-ph="ENGLISH COPY">${escHtml(b.en)}</div>
        <div class="bh-ko" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="ko" data-ph="한글 카피">${escHtml(b.ko)}</div>
      </div>

        ? phFigure(b.src, `<div class="ph-tools"><button data-act="split-change" data-si="${si}" data-bi="${bi}">사진 변경</button></div>`)
        : `<button class="ph-empty" data-act="split-change" data-si="${si}" data-bi="${bi}">사진 선택</button>`}
    </div>`;
  } else if(b.t === 'cover'){
    body = b.src
      ? `<div class="bcover">${phFigure(b.src, `<div class="ph-tools"><button data-act="cover-change" data-si="${si}" data-bi="${bi}">사진 변경</button></div>`)}</div>
         <div class="bcover-note">발행 시 이 사진은 여백 없는 전면 대지 한 장이 됩니다</div>`
      : `<button class="ph-empty" data-act="cover-change" data-si="${si}" data-bi="${bi}">전면 사진 선택</button>`;
  } else if(b.t === 'title'){
    body = `<div class="btitle">
      <div class="bt1" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="t1" data-ph="ISSUE NO.76 · DECEMBER 2025">${escHtml(b.t1)}</div>
      <div class="bt2" contenteditable="true" data-si="${si}" data-bi="${bi}" data-f="t2" data-ph="CAREER PLANNING">${escHtml(b.t2)}</div>
    </div>`;
  } else if(b.t === 'toc'){
    body = `<div class="btoc">
      ${BOOK.chapters.map((c, i) => `<div class="btoc-i"><span class="btoc-no">${pad2(i)}</span>${escHtml(c.title)}</div>`).join('')}
      <div class="btoc-note">목차는 챕터 구성에서 자동으로 만들어집니다</div>
    </div>`;
  }
  return `<div class="blk t-${b.t}${b.t === 'photo' && b.bleed ? ' bleed' : ''}" data-si="${si}" data-bi="${bi}">${h}${body}</div>`;
}

          ? s.blocks.map((b, bi) => igapHTML(si, bi) + blkHTML(b, si, bi)).join('') + igapHTML(si, s.blocks.length)
          : `<div class="empty-sheet"><button data-act="plus" data-si="${si}" data-bi="0">+ 블록 추가</button></div>`}

const ELEMENTS = [

/* ─ 블록 선택 + 속성 패널 ─ */
let SEL = null; /* {si, bi} */
function selBlock(){
  if(!SEL) return null;
  const sh = chap().sheets[SEL.si];
  return sh ? sh.blocks[SEL.bi] || null : null;
}
function selectBlk(si, bi){
  SEL = { si, bi };
  document.querySelectorAll('.blk.sel').forEach(el => el.classList.remove('sel'));
  const el = document.querySelector(`.blk[data-si="${si}"][data-bi="${bi}"]`);
  if(el) el.classList.add('sel');

function clearSel(){
  SEL = null;
  document.querySelectorAll('.blk.sel').forEach(el => el.classList.remove('sel'));

}

  } else if(b.t === 'video'){

$('blkProps').addEventListener('click', e => {
  const seg = e.target.closest('[data-seg]');
  if(seg && SEL){
    const b = selBlock();
    if(b){
      const key = seg.dataset.seg, v = seg.dataset.v;
      b[key] = (key === 'align' && v === 'l') || (key !== 'align' && v === 'm') ? undefined : v;
      if(b[key] === undefined) delete b[key];
      markDirty(); renderSheets(); renderBlkProps();
    }
    return;
  }
  const btn = e.target.closest('[data-pact]');
  if(!btn || !SEL) return;
  const b = selBlock(); if(!b) return;
  const { si, bi } = SEL;
  const act = btn.dataset.pact;
  if(act === 'done'){ clearSel(); return; }
  if(act === 'img'){
    if(b.t === 'photo') pickImage({ kind:'photo', si, bi });
    else if(b.t === 'duo') pickImage({ kind:'duo', si, bi, slot:+btn.dataset.slot });
    else if(b.t === 'split') pickImage({ kind:'split', si, bi });
    else if(b.t === 'cover') pickImage({ kind:'coverblk', si, bi });
  }
  else if(act === 'bleed'){ b.bleed = !b.bleed; markDirty(); renderSheets(); }
  else if(act === 'fill'){ b.fill = !b.fill; markDirty(); renderBlkProps(); }
  else if(act === 'vapply'){
    b.url = $('ppVurl').value.trim();
    if(parseYouTube(b.url)) delete b._err; else b._err = true;
    markDirty(); renderSheets();
  }
  else if(act === 'del'){
    const doDel = () => { chap().sheets[si].blocks.splice(bi, 1); clearSel(); markDirty(); renderSheets(); };
    if(isEmptyBlock(b)) doDel();
    else ask(btn, '이 블록을 삭제한다. 되돌릴 수 없다.', '삭제', true, doDel);
  }
});

let ovTimer = null;
function checkOverflows(){
  document.querySelectorAll('.swrap').forEach(w => {

/* ═══════════ 블록·대지 조작 ═══════════ */
const NEW_BLOCK = {
  ctitle:  () => ({ t:'ctitle', text:'' }),
  p:       () => ({ t:'p', html:'' }),
  head:    () => ({ t:'head', en:'', ko:'' }),
  verse:   () => ({ t:'verse', text:'' }),
  photo:   () => ({ t:'photo', src:'', bleed:false }),
  duo:     () => ({ t:'duo', srcs:['',''] }),
  video:   () => ({ t:'video', url:'', note:'' }),
  divider: () => ({ t:'divider' }),
  split:   () => ({ t:'split', en:'', ko:'', src:'' }),
  toc:     () => ({ t:'toc' }),
  cover:   () => ({ t:'cover', src:'' }),
  title:   () => ({ t:'title', t1:'', t2:'' })
};
const PALETTE = [
  ['p','문','문단'], ['head','H','헤드라인'], ['verse','❝','인용·운문'],
  ['split','◧','카피+사진'], ['photo','▣','사진'], ['duo','▣▣','사진 두 장'],
  ['cover','■','전면 사진'], ['title','T','표제지'], ['toc','☰','목차'],
  ['video','▶','영상'], ['divider','◆','구분선']
];

let palTarget = null;
function openPalette(anchor, si, bi){
  palTarget = { si, bi };
  const p = $('palette');
  p.innerHTML = PALETTE.map(([t, ic, label]) =>
    `<button data-pt="${t}" role="menuitem"><span class="pi">${ic}</span>${label}</button>`).join('');
  p.classList.add('open');
  const r = anchor.getBoundingClientRect();
  p.style.left = '0px'; p.style.top = '0px';
  const w = p.offsetWidth, h = p.offsetHeight;
  const x = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  let y = r.bottom + 6;
  if(y + h > window.innerHeight - 8) y = r.top - h - 6;
  p.style.left = x + 'px'; p.style.top = Math.max(8, y) + 'px';
  p.querySelector('button').focus();
}
function closePalette(){ $('palette').classList.remove('open'); palTarget = null; }

function moveBlock(si, bi, dir){
  const sheets = chap().sheets;
  const arr = sheets[si].blocks;
  if(dir < 0){
    if(bi > 0){ [arr[bi-1], arr[bi]] = [arr[bi], arr[bi-1]]; }
    else if(si > 0){ sheets[si-1].blocks.push(arr.shift()); }
    else return;
  } else {
    if(bi < arr.length - 1){ [arr[bi+1], arr[bi]] = [arr[bi], arr[bi+1]]; }
    else {
      if(si === sheets.length - 1) sheets.push({ blocks: [] });
      sheets[si+1].blocks.unshift(arr.pop());
    }
  }
  markDirty(); renderSheets();
}
function isEmptyBlock(b){
  if(b.t === 'ctitle') return !(b.text || '').trim();
  if(b.t === 'p') return !sanitizeHtml(b.html).replace(/<br>/g, '').trim();
  if(b.t === 'head') return !(b.en || '').trim() && !(b.ko || '').trim();
  if(b.t === 'verse') return !(b.text || '').trim();
  if(b.t === 'photo') return !b.src;
  if(b.t === 'duo') return !b.srcs[0] && !b.srcs[1];
  if(b.t === 'video') return !b.url;
  if(b.t === 'split') return !(b.en || '').trim() && !(b.ko || '').trim() && !b.src;
  if(b.t === 'cover') return !b.src;
  if(b.t === 'title') return !(b.t1 || '').trim() && !(b.t2 || '').trim();
  return true; /* divider·toc — 자동 생성이라 확인 없이 삭제 */
}

/* 사진 업로드: FileReader → canvas(긴 변 1600px 다운스케일) → JPEG data URI */
let fileTarget = null;
function pickImage(target){ fileTarget = target; $('fileIn').value = ''; $('fileIn').click(); }

/* ═══════════ 이벤트 ═══════════ */
$('fileIn').addEventListener('change', () => {
  const f = $('fileIn').files[0];
  if(!f || !fileTarget) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.width, h = img.height;
      if(Math.max(w, h) > MAX){ const k = MAX / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const uri = cv.toDataURL('image/jpeg', 0.82);
      if(uri.length > 2 * 1024 * 1024) toast('사진 용량이 큽니다 — 발행 저장이 실패할 수 있습니다');
      const t = fileTarget; fileTarget = null;
      if(t.kind === 'cover'){ BOOK.cover = uri; renderCovRow(); }
      else if(t.kind === 'duo'){ chap().sheets[t.si].blocks[t.bi].srcs[t.slot] = uri; renderSheets(); }
      else { chap().sheets[t.si].blocks[t.bi].src = uri; renderSheets(); } /* photo·split·coverblk */
      markDirty();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

$('palette').addEventListener('click', e => {

$('sheets').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b){
    const blkEl = e.target.closest('.blk');
    if(blkEl) selectBlk(+blkEl.dataset.si, +blkEl.dataset.bi);
    return;
  }
  const si = +b.dataset.si, bi = +b.dataset.bi;
  const act = b.dataset.act;
  if(act === 'plus') openPalette(b, si, bi);
  else if(act === 'up') moveBlock(si, bi, -1);
  else if(act === 'down') moveBlock(si, bi, 1);
  else if(act === 'dup'){
    const src = chap().sheets[si].blocks[bi];
    chap().sheets[si].blocks.splice(bi + 1, 0, JSON.parse(JSON.stringify(src)));
    markDirty(); renderSheets();
  }
  else if(act === 'del'){
    const blk = chap().sheets[si].blocks[bi];
    const doDel = () => { chap().sheets[si].blocks.splice(bi, 1); markDirty(); renderSheets(); };
    if(isEmptyBlock(blk)) doDel();
    else ask(b, '이 블록을 삭제한다. 되돌릴 수 없다.', '삭제', true, doDel);
  }
  else if(act === 'sheet-add'){
    chap().sheets.splice(si + 1, 0, { blocks: [] });
    markDirty(); renderSheets();
  }
  else if(act === 'sheet-del'){
    const s = chap().sheets[si];
    const doDel = () => { chap().sheets.splice(si, 1); markDirty(); renderSheets(); };
    if(!s.blocks.length) doDel();
    else ask(b, `블록 ${s.blocks.length}개가 함께 삭제된다.`, '대지 삭제', true, doDel);
  }
  else if(act === 'ph-change') pickImage({ kind:'photo', si, bi });
  else if(act === 'split-change') pickImage({ kind:'split', si, bi });
  else if(act === 'cover-change') pickImage({ kind:'coverblk', si, bi });
  else if(act === 'duo-change') pickImage({ kind:'duo', si, bi, slot:+b.dataset.slot });
  else if(act === 'ph-bleed'){
    const blk = chap().sheets[si].blocks[bi];
    blk.bleed = !blk.bleed; markDirty(); renderSheets();
  }
  else if(act === 'v-embed'){
    const blk = chap().sheets[si].blocks[bi];
    const url = $(`vurl-${si}-${bi}`).value.trim();
    blk.url = url;
    if(parseYouTube(url)) delete blk._err; else blk._err = true;
    markDirty(); renderSheets();
  }
  else if(act === 'v-reset'){
    const blk = chap().sheets[si].blocks[bi];
    blk.url = ''; delete blk._err; markDirty(); renderSheets();
  }
});

/* 텍스트 입력 → 데이터 반영 (재렌더 없이 — 커서 유지) */

/* ── 발행·미리보기 ──
   발행 페이로드는 리더기(ebook-reader) 네이티브 스키마로 변환해 저장한다.
   리더기 블록 어휘: block(label+paras)·head·verse·photo·duo, 영상은 챕터 레벨(videoUrl).
   편집기 내부 모델(p·divider·video 블록)과의 대응: 연속 p → block.paras,
   divider → verse '◆', 첫 video 블록 → 챕터 video, 빈 블록·빈 대지는 버린다. */
function toReaderBook(){
  let page = 0;
  const chapters = [];
  BOOK.chapters.forEach((c, ci) => {
    let video = null;
    const sheets = [];
    c.sheets.forEach(s => {
      let blocks = [];
      let run = null;
      const flushNormal = () => { if(blocks.length){ sheets.push({ no: pad2(++page), blocks }); blocks = []; } };
      s.blocks.forEach(b => {
        if(b.t === 'p'){
          let html = sanitizeHtml(b.html);
          if(!html.replace(/<br>/g, '').trim()) return;
          const cls = fmtCls(b);
          if(cls) html = `<span class="pfmt${cls}">${html}</span>`;
          const label = escHtml((b.label || '').trim());
          if(!run || label){ run = { t:'block', label, paras:[] }; blocks.push(run); }
          run.paras.push(html);
          return;
        }
        run = null;
        if(b.t === 'ctitle'){ if((b.text || '').trim()) blocks.push({ t:'ctitle', text:escHtml(b.text) }); }
        else if(b.t === 'head'){
          if((b.en || '').trim() || (b.ko || '').trim())
            blocks.push({ t:'head', en:escHtml(b.en || ''), ko:escHtml(b.ko || '') });
        }
        else if(b.t === 'verse'){
          if((b.text || '').trim()){
            const cls = fmtCls(b);
            blocks.push({ t:'verse', text: cls ? `<span class="pfmt${cls}">${escHtml(b.text)}</span>` : escHtml(b.text) });
          }
        }
        else if(b.t === 'divider') blocks.push({ t:'verse', text:'◆' });
        else if(b.t === 'photo'){ if(b.src) blocks.push({ t:'photo', src:b.src, bleed:!!b.bleed, fill:!!b.fill }); }
        else if(b.t === 'duo'){ const ss = (b.srcs || []).filter(Boolean); if(ss.length) blocks.push({ t:'duo', srcs:ss }); }
        else if(b.t === 'split'){
          if(b.src) blocks.push({ t:'split', en:escHtml(b.en || ''), ko:escHtml(b.ko || ''), src:b.src });
          else if((b.en || '').trim() || (b.ko || '').trim())
            blocks.push({ t:'head', en:escHtml(b.en || ''), ko:escHtml(b.ko || '') }); /* 사진 없으면 헤드라인으로 강등 */
        }
        else if(b.t === 'cover'){
          /* 전면 사진은 여백 없는(flush) 대지 한 장으로 분리한다 — 리더기 지면 문법 */
          if(b.src){ flushNormal(); sheets.push({ no: pad2(++page), flush:true, blocks:[{ t:'cover', src:b.src }] }); }
        }
        else if(b.t === 'title'){
          if((b.t1 || '').trim() || (b.t2 || '').trim())
            blocks.push({ t:'title', t1:escHtml(b.t1 || ''), t2:escHtml(b.t2 || '') });
        }
        else if(b.t === 'toc') blocks.push({ t:'toc' });
        else if(b.t === 'video'){
          const emb = parseYouTube(b.url);
          if(emb && !video) video = { url: emb, note: escHtml(b.note || '') };
        }
      });
      flushNormal();
    });
    const rc = {
      id: c.id || ('ch' + ci), no: pad2(ci), tag: escHtml(c.tag || ''), title: escHtml(c.title || ''),
      voice: c.voice ? { label: escHtml(c.voice.label), dur: escHtml(c.voice.dur) } : null,
      sheets
    };
    if(video){ rc.video = true; rc.videoUrl = video.url; rc.videoNote = video.note; }
    chapters.push(rc);
  });
  const issueRaw = (BOOK.issue || '').trim();
  return {
    v: 2,
    issue: escHtml(/^\d+$/.test(issueRaw) ? 'NO.' + issueRaw : issueRaw),
    title: escHtml(BOOK.title || ''), subtitle: escHtml(BOOK.subtitle || ''), cover: BOOK.cover || null,
    chapters,
    toc: chapters.map(c => ({ no: c.no, t: c.title.replace(/^\d+[.)]\s*/, ''), items: [] })),
    tocNav: chapters.map((c, i) => [ c.sheets.length ? { chapter: i, sheet: c.sheets[0].no } : null ])
  };
}
function savePub(key, failMsg){
  try{ localStorage.setItem(key, JSON.stringify(toReaderBook())); return true; }
  catch(e){ toast(failMsg); return false; }
}
$('pubBtn').addEventListener('click', e => {

/* ── 글자 포맷 툴바 (문단 드래그 선택) ── */
function fmtTargetEl(){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed) return null;
  const node = sel.anchorNode;
  const el = (node.nodeType === 3 ? node.parentElement : node).closest('.bp[contenteditable]');
  if(!el) return null;
  const fnode = sel.focusNode;
  if(!(el.contains(fnode))) return null;
  return el;
}
function showFmt(){
  const el = fmtTargetEl();
  const f = $('fmt');
  if(!el){ f.classList.remove('open'); return; }
  const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
  f.classList.add('open');
  const w = f.offsetWidth, h = f.offsetHeight;
  const x = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  let y = r.top - h - 8;
  if(y < 8) y = r.bottom + 8;
  f.style.left = x + 'px'; f.style.top = y + 'px';
}
document.addEventListener('mouseup', e => {
  if(e.target.closest('#fmt')) return;
  setTimeout(showFmt, 0);
});
document.addEventListener('keyup', e => {
  if(e.key.startsWith('Arrow') || e.key === 'Shift') setTimeout(showFmt, 0);
});
$('fmt').addEventListener('mousedown', e => e.preventDefault()); /* 셀렉션 유지 */
$('fmt').addEventListener('click', e => {
  const b = e.target.closest('[data-f]');
  if(!b) return;
  const el = fmtTargetEl();
  if(!el) return;
  const kind = b.dataset.f;
  if(kind === 'b') document.execCommand('bold');
  else if(kind === 'c-blue') document.execCommand('foreColor', false, '#067CAF');
  else if(kind === 'c-pink') document.execCommand('foreColor', false, '#ED2390');
  else if(kind === 'hl'){
    try{ document.execCommand('hiliteColor', false, '#F2C53D'); }
    catch(err){ document.execCommand('backColor', false, '#F2C53D'); }
  }
  else if(kind === 'sm') document.execCommand('fontSize', false, '2');
  else if(kind === 'lg') document.execCommand('fontSize', false, '5');
  else if(kind === 'clear') document.execCommand('removeFormat');
  /* 저장 + 표시 정규화(브라우저 font 태그 → 클래스 span) */
  const { si, bi } = el.dataset;
  const blk = chap().sheets[+si].blocks[+bi];
  blk.html = sanitizeHtml(el.innerHTML);
  el.innerHTML = blk.html;
  markDirty(); queueOverflow();
  window.getSelection().removeAllRanges();
  $('fmt').classList.remove('open');
});

/* ── 전역 닫기 ── */
document.addEventListener('click', e => {
  if(!e.target.closest('#palette') && !e.target.closest('[data-act="plus"]')) closePalette();
  if(!askGuard && !e.target.closest('#ask')) closeAsk();
});
$('bdim').addEventListener('click', e => { if(e.target === $('bdim')) closeBookModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closePalette(); closeAsk(); clearSel(); closeBookModal();
    document.querySelector('.side').classList.remove('open');
    $('fmt').classList.remove('open');
  }
});

/* ── 시작 ── */
renderAll();
if(_draft){ lastSaved = Date.now(); refreshStat(); toast('임시저장본을 불러왔습니다'); }
else openBookModal('new'); /* 첫 방문 — 책 기본 정보부터 (샘플 값이 채워져 있음) */
</script>
