<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 강의 — 트루스월드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --night:#231B2E; --night-2:#1A1424; --ink:#17171C; --cream:#FFF9F1; --pink:#F26D9C;
  --line:#3E3155; --sub:#B7AACB;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(var(--night), var(--night-2)); min-height:100vh; color:#fff;
  letter-spacing:-0.01em; word-break:keep-all}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
a{color:inherit; text-decoration:none}
.stars{position:fixed; inset:0; pointer-events:none}
.stars::before{content:""; position:absolute; left:6%; top:8%; width:4px; height:4px; background:#fff; opacity:.7;
  box-shadow:20vw 40px #FFF6C9, 42vw 12px #fff, 60vw 55px #FBE4EE, 78vw 22px #fff, 92vw 48px #C9E9FA, 30vw 90px #fff}
.wrap{max-width:560px; margin:0 auto; padding:26px 18px 80px; position:relative}
.top{display:flex; align-items:center; gap:8px; margin-bottom:22px}
.back{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px}
.back:hover{background:rgba(255,255,255,.08)}
h1{font-size:1.4rem; font-weight:900; letter-spacing:-0.02em}
.sub{font-size:.84rem; color:var(--sub); margin:4px 0 0}

.course{background:var(--cream); color:var(--ink); border:3px solid var(--ink); border-radius:14px;
  box-shadow:6px 6px 0 rgba(0,0,0,.4); padding:18px; margin-bottom:18px}
.course .ck{font-size:.68rem; font-weight:800; letter-spacing:.1em; color:#8A7F6A}
.course h2{font-size:1.15rem; font-weight:900; margin:5px 0 3px}
.course .cd{font-size:.82rem; color:#6E6353}
.prog{display:flex; align-items:center; gap:10px; margin-top:13px}
.prog .bar{flex:1; height:9px; border-radius:5px; background:#EADFC9; overflow:hidden}
.prog .bar i{display:block; height:100%; width:20%; background:linear-gradient(90deg,var(--pink),#FF9DBE)}
.prog span{font-size:.72rem; font-weight:800; color:#8A7F6A}

.ep{display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--cream); color:var(--ink);
  border:3px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 rgba(0,0,0,.4); padding:13px 15px; margin-bottom:12px;
  transition:transform .1s}
.ep:hover{transform:translateY(-2px)}
.ep .no{width:34px; height:34px; border-radius:9px; background:var(--ink); color:#FFE79A; font-weight:800;
  display:flex; align-items:center; justify-content:center; font-size:.82rem; flex-shrink:0}
.ep .tt{flex:1; min-width:0}
.ep .tt b{display:block; font-size:.95rem; font-weight:800}
.ep .tt small{display:block; font-size:.74rem; color:#6E6353; margin-top:2px}
.ep .st{font-size:.7rem; font-weight:800; padding:4px 9px; border-radius:7px; flex-shrink:0}
.ep .st.now{background:var(--pink); color:#fff}
.ep .st.done{background:#DFF0DC; color:#2E6B3E}
.ep .st.lock{background:#EDE6D8; color:#8A7F6A}
.ep.lock{opacity:.62}
.ep.lock:hover{transform:none}
.note{font-size:.74rem; color:var(--sub); text-align:center; margin-top:18px}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <div class="top">
    <a class="back" href="world-prototype.html" aria-label="트루스월드로">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div>
      <h1>나의 강의</h1>
      <p class="sub">이어서 들으면 코치들이 같이 들어와요</p>
    </div>
  </div>

  <div class="course">
    <p class="ck">CURRICULUM · 5단계 중 마지막</p>
    <h2>일의 교과서</h2>
    <p class="cd">전략을 바운더리로 세우는 마지막 단계예요</p>
    <div class="prog"><div class="bar"><i></i></div><span>1/5 수강 중</span></div>
  </div>

  <a class="ep" href="lecture-prototype.html">
    <span class="no">1강</span>
    <span class="tt"><b>전략 설정</b><small>9블록 · 인터랙티브 6종 · 코치와 같이 들어요</small></span>
    <span class="st now">이어듣기 ›</span>
  </a>
  <button class="ep lock" data-l>
    <span class="no">2강</span>
    <span class="tt"><b>끝점 정의</b><small>1강을 완강하면 열려요</small></span>
    <span class="st lock">🔒</span>
  </button>
  <button class="ep lock" data-l>
    <span class="no">3강</span>
    <span class="tt"><b>버리는 목록</b><small>순서대로 열려요</small></span>
    <span class="st lock">🔒</span>
  </button>
  <button class="ep lock" data-l>
    <span class="no">4강</span>
    <span class="tt"><b>3개월 지도</b><small>순서대로 열려요</small></span>
    <span class="st lock">🔒</span>
  </button>
  <button class="ep" data-done>
    <span class="no">0강</span>
    <span class="tt"><b>오리엔테이션</b><small>바운더리 타운에 온 걸 환영해요</small></span>
    <span class="st done">완강 ✓</span>
  </button>

  <p class="note">임시 화면이에요 — 실제 커리큘럼 데이터와 연결되기 전까지의 설계 시안입니다</p>
</div>
<div class="toast" id="toast" role="status" style="position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(14px);
  background:rgba(17,17,17,.94);color:#fff;font-size:.88rem;font-weight:600;padding:12px 18px;border-radius:12px;
  opacity:0;visibility:hidden;transition:opacity .2s, transform .2s;z-index:120"></div>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = 1; t.style.visibility = 'visible'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = 0; t.style.visibility = 'hidden'; t.style.transform = 'translateX(-50%) translateY(14px)'; }, 2400);
}
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => toast('앞 강의를 완강하면 열려요 🔒')));
const doneBtn = document.querySelector('[data-done]');
if(doneBtn) doneBtn.addEventListener('click', () => toast('완강한 강의는 곧 다시 듣기로 열려요 (목업)'));
</script>
</body>
</html>
