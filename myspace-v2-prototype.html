<style>
/* ===== 1. 토큰 · 레이아웃 ===== */
:root{
  --paper:#FFFFFF; --ink:#191F28; --muted:#6B7684; --faint:#B0B8C1;
  --line:#E5E8EB; --bg:#F7F8FA;
  --indigo:#5B5BD6; --indigo-soft:#EEF0FF; --indigo-ink:#3F3FB0;
  --ok:#22A06B; --warn:#F5A623; --danger:#E5484D;
  --radius:10px; --shadow:0 4px 16px rgba(25,31,40,.06);
  --side-w:240px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
/* 사이드바 */
.side{width:var(--side-w);flex:none;background:var(--bg);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side .me{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.side .me b{font-size:15px}
.side .stage{display:inline-block;font-size:11px;font-weight:600;color:var(--indigo-ink);background:var(--indigo-soft);border-radius:999px;padding:2px 8px;cursor:pointer}
.side h4{margin:14px 8px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.side .nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:14px;color:var(--ink);text-decoration:none}
.side .nav:hover{background:rgba(25,31,40,.05)}
.side .nav.on{background:var(--indigo-soft);color:var(--indigo-ink);font-weight:600}
.side .nav small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.side .nav.sub{padding-left:22px;font-size:13px}
.side .nav[disabled]{color:var(--faint);cursor:not-allowed}
.side .foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.side .foot .nav{color:var(--indigo-ink);font-weight:600}
/* 문서 */
.doc{flex:1;min-width:0;padding:0 40px 120px}
.doc-in{max-width:860px;margin:0 auto}
.doc-head{padding:36px 0 8px}
.doc-head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.doc-head .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--indigo-soft);color:var(--indigo-ink)}
.menu-btn{display:none}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:rgba(25,31,40,.35);z-index:40}

/* ===== 3. 데일리 ===== */
/* ===== 4. 코치 ===== */

</style>
</head>

// ===== LOGIC =====
const KEY = 'trus_myspace_v2';
function todayStr() {
  const p = Q.get('today');
  if (p) return p;
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function blank() { return { text: '', done: false, tag: null }; }
function defaultState() {
  return { v: 2, user: { ...USER }, boundary: { ...BOUNDARY, formula: { ...FORMULA } }, days: JSON.parse(JSON.stringify(PAST_DAYS)), coachSeen: {} };
}
function loadState(storage) {
  try {
    const raw = storage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 2) return s; }
  } catch (e) { /* 무시 */ }
  return defaultState();
}
function saveState(storage, state, onFail) {
  try { storage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { if (onFail) onFail(e); return false; }
}
function ensureDay(state, date) {
  if (!state.days[date]) state.days[date] = { items: [blank(), blank(), blank()], review: '' };
  return state.days[date];
}
const FKEYS = ['numeric', 'customer', 'problem', 'strategy'];
function formulaCount(f) { return FKEYS.filter(k => (f[k] || '').trim()).length; }
function endDefined(f) { return !!((f.numeric || '').trim() || (f.customer || '').trim()); }
function dayProgress(day) {
  const filled = day.items.filter(i => i.text.trim());
  return { filled: filled.length, done: filled.filter(i => i.done).length };
}
function keywords(f) {
  const set = new Set();
  FKEYS.forEach(k => (f[k] || '').split(/[\s,.!?'"“”·()]+/).forEach(t => {
    t = t.replace(/(을|를|이|가|은|는|의|에서|도|로|과|와|에)$/, '');
    if (t.length >= 2) set.add(t);
  }));
  return [...set];
}
function judgeSignal(item, f) {
  if (!item.text.trim()) return null;
  if (item.tag) return 'signal';
  return keywords(f).some(k => item.text.includes(k)) ? 'signal' : 'noise';
}
function stageOf(n) { return STAGES[Math.min(6, Math.max(1, Number(n) || 1)) - 1]; }
function greeting(hour) { return hour < 18 ? 'am' : 'pm'; }
function canFire(seen, date, key, idx) {
  const d = seen[date] || (seen[date] = {});
  if (idx != null) {
    d[key] = d[key] || [];
    if (d[key][idx]) return false;
    d[key][idx] = true; return true;
  }
  if (d[key]) return false;
  d[key] = true; return true;
}
function addSuggestion(day, sug) {
  const i = day.items.findIndex(it => !it.text.trim());
  if (i < 0) return { ok: false, reason: 'full' };
  day.items[i] = { text: sug.text, done: false, tag: sug.tag };
  return { ok: true, index: i };
}
function replaceItem(day, idx, sug) {
  const old = day.items[idx];
  day.items[idx] = { text: sug.text, done: false, tag: sug.tag };
  return old;
}
function freeReply(text) {
  for (const f of FREE) if (f.k.some(k => text.includes(k))) return f.r;
  return FREE_FALLBACK;
}
function lastReview(state, today) {
  const dates = Object.keys(state.days).filter(d => d < today).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const r = (state.days[dates[i]].review || '').trim();
    if (r) return { date: dates[i], review: r };
  }
  return null;
}
function daysLeft(to, today) { return Math.round((Date.parse(to) - Date.parse(today)) / 86400000); }
function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const w = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
  return `${m}월 ${d}일 ${w}요일`;
}
