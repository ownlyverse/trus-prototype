<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바운더리 타운 — 강의실 (프로토타입)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'NeoDunggeunmo'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NeoDunggeunmo.woff') format('woff'); font-display:swap}
:root{
  --ink:#191F28; --paper:#FFF9F1;
  --night:#231B2E; --night-2:#2E2340;
  --accent:#F26D9C; --accent-d:#C24C78; --accent-soft:#FBE4EE;
  --tide:#3182F6; --shell:#F76B1C;
  --muted:#8B95A1; --line:#E8DFD2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--ink); letter-spacing:-0.01em; background:var(--night); min-height:100vh; word-break:keep-all;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
.pxfont, .hud-btn, .step-label, .pbtn{font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; letter-spacing:0}

/* 밤 자습실 배경 — 별 + 창밖 불빛 */
.bg-night{position:fixed; inset:0; pointer-events:none;
  background:linear-gradient(var(--night) 0%, var(--night-2) 100%)}
.bg-night::before{content:""; position:absolute; left:5%; top:6%; width:4px; height:4px; background:#fff; opacity:.7;
  box-shadow:18vw 30px #FFF6C9, 39vw 8px #fff, 57vw 40px #FBE4EE, 74vw 16px #fff, 90vw 34px #C9E9FA, 28vw 70px #fff, 66vw 78px #FFF6C9}
.bg-night::after{content:""; position:absolute; left:0; right:0; bottom:0; height:90px; opacity:.5;
  background:
    linear-gradient(#171130,#171130) 4% 100%/9% 70% no-repeat,
    repeating-linear-gradient(180deg,#F26D9C 0 5px, transparent 5px 14px) 5% 100%/5% 55% no-repeat,
    linear-gradient(#171130,#171130) 84% 100%/9% 84% no-repeat,
    repeating-linear-gradient(180deg,#46D5B2 0 5px, transparent 5px 14px) 85% 100%/5% 66% no-repeat}

/* HUD */
.hud{position:fixed; top:0; left:0; right:0; z-index:60; display:flex; align-items:flex-start; gap:8px; padding:12px 14px; pointer-events:none}
.hud>*{pointer-events:auto}
.hud .spacer{flex:1; pointer-events:none}
.hud-btn{width:44px; height:44px; border-radius:50%; background:rgba(23,19,31,.82); border:2px solid #3E3155; color:#FFE6F0;
  box-shadow:0 3px 12px rgba(0,0,0,.4), 0 0 18px rgba(242,109,156,.14); display:flex; align-items:center; justify-content:center;
  transition:transform .1s, box-shadow .1s, border-color .12s}
.hud-btn svg{width:21px; height:21px}
.hud-btn:hover{border-color:#F26D9C; box-shadow:0 3px 12px rgba(0,0,0,.4), 0 0 22px rgba(242,109,156,.35)}
.hud-btn:active{transform:translateY(2px); box-shadow:0 1px 6px rgba(0,0,0,.4)}

/* 메뉴 드로어 — 목차 · 커리큘럼 */
.menu-drawer{position:fixed; top:62px; right:14px; z-index:66; width:284px; max-width:calc(100vw - 28px);
  max-height:calc(100vh - 80px); overflow-y:auto;
  background:var(--paper); border:3px solid #17131F; border-radius:11px; box-shadow:6px 6px 0 rgba(0,0,0,.35);
  padding:9px; display:none; flex-direction:column}
.menu-drawer.open{display:flex; animation:mdpop .16s ease-out}
@keyframes mdpop{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
.md-group{display:flex; flex-direction:column; gap:2px}
.md-group + .md-group{margin-top:7px; padding-top:8px; border-top:2px dashed var(--line)}
.md-label{font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; letter-spacing:0;
  font-size:.66rem; font-weight:700; color:var(--muted); padding:2px 8px 5px}
.md-item{display:flex; align-items:center; gap:11px; width:100%; padding:9px 10px; border-radius:8px; text-align:left; transition:background .12s}
.md-item:hover{background:#F2F4F6}
.md-item:active{background:#E6EAEE}
.md-ic{font-size:1.05rem; width:22px; text-align:center; flex-shrink:0; line-height:1}
.md-name{font-size:.84rem; font-weight:600; color:var(--ink); flex:1; min-width:0}

.toc-item.now{background:var(--accent-soft)}
.toc-item.now:hover{background:var(--accent-soft)}
.toc-item.now .md-name{color:var(--accent-d); font-weight:800}
.toc-item.done .md-ic{color:#1BA664}
.toc-item.lock{opacity:.45}
.toc-item.lock:hover{background:transparent}
.cur-item{cursor:default}
.cur-item:hover{background:transparent}
.cur-item:active{background:transparent}
.cur-item .md-name small{display:block; font-size:.68rem; font-weight:500; color:var(--muted); margin-top:1px}
.cur-item.now{background:var(--accent-soft)}
.cur-item.now .md-name{color:var(--accent-d); font-weight:800}
.cur-item.done .md-ic{color:#1BA664}
.cur-badge{font-size:.6rem; font-weight:700; color:#1BA664; background:#E7F6EE; border-radius:6px; padding:2px 6px; white-space:nowrap; flex-shrink:0}

/* 무대 */
.stage{width:100%; margin:0 auto; padding:78px 20px 44px; position:relative}
.lesson-col{max-width:640px; margin:0 auto}

/* 라이브 강의실 — 코치2+나(좌 세로 3) · 강의자(가운데 세로 대형) · 메모(우 컬럼) */
.liveroom{
  --H:min(760px, 82vh, 48vw);              /* 스포트라이트(발화자) 세로 높이 */
  display:grid; justify-content:center; gap:12px 18px; margin:14px auto 8px;
  grid-template-columns:auto minmax(280px,380px);
  grid-template-areas:"head head" "stage memo";
}
/* 발화자 스포트라이트 무대 — 스포트 슬롯(세로 대형) + 사이드 슬롯(가로 소형).
   발화자가 바뀌면 JS가 타일을 슬롯 사이로 옮긴다 */
.spotstage{display:flex; gap:16px; align-items:flex-start; grid-area:stage}
.liveroom > .memo{grid-area:memo; align-self:start}
.spot-slot .vid{height:var(--H); width:calc(var(--H)*9/16); aspect-ratio:9/16; cursor:default}
.mid-col{display:flex; flex-direction:column; gap:14px; min-width:0; width:min(236px, 20vw)}
.mid-col .vid{width:100%; height:auto; aspect-ratio:16/9; cursor:pointer}
.mid-col .vid:hover{outline:3px solid #E86CA8; outline-offset:2px}
.vid.pop{animation:spotpop .35s ease}
@keyframes spotpop{from{transform:scale(.94); opacity:.55} to{transform:none; opacity:1}}
.liveroom > .memo{height:var(--H); display:flex; flex-direction:column; overflow:hidden; min-width:0}
.liveroom > .memo .memo-body{flex:1; min-height:0; max-height:none}

/* 좁은 화면: 스포트(세로) → 청자 2명 가로 일렬 → 메모 (기본 규칙보다 반드시 뒤) */
@media(max-width:860px){
  .liveroom{display:flex; flex-direction:column; align-items:center}
  .lec-head{width:min(80vw,340px); text-align:left}
  .spotstage{position:relative; flex-direction:column; align-items:center; width:100%}
  .spot-slot{display:flex; justify-content:center; width:100%}
  .spot-slot .vid{height:auto; width:min(80vw,340px); aspect-ratio:9/16}
  /* 코치 2명 = 강의자 화면 우상단 PiP 오버레이 (누르면 스포트 교대) */
  .mid-col{position:absolute; top:10px; right:calc((100% - min(80vw,340px))/2 + 10px);
    flex-direction:column; width:92px; gap:8px; z-index:6}
  .mid-col .vid{width:92px; height:auto; aspect-ratio:16/9; border-width:2px; box-shadow:2px 2px 0 rgba(0,0,0,.45)}
  .mid-col .vid .vtag{font-size:.5rem; left:4px; bottom:4px; padding:1px 4px}
  .mid-col .vid .vlive{width:5px; height:5px; right:4px; top:4px}
  /* 메모 = 유튜브 댓글식 바텀시트 (재생바 옆 💬로 여닫음) */
  .liveroom > .memo{position:fixed; left:0; right:0; bottom:0; top:auto; height:min(62vh,480px); width:auto;
    margin:0; z-index:90; border-radius:16px 16px 0 0; border-bottom:none;
    transform:translateY(calc(100% + 12px)); transition:transform .28s}
  body.memo-open .liveroom > .memo{transform:none}
  .spot-slot .vmemo{display:flex}
  .memo-hide{display:inline-flex}
}
.vid{position:relative; border:3px solid #17171C; border-radius:6px; overflow:hidden; background:#000; box-shadow:4px 4px 0 rgba(0,0,0,.4); aspect-ratio:16/9}
.vid img, .vid video{width:100%; height:100%; object-fit:cover; display:block}
.vid.main{box-shadow:7px 7px 0 rgba(0,0,0,.45)}
.vtag{position:absolute; left:8px; bottom:8px; background:rgba(23,19,31,.88); color:#fff; font-size:.74rem; padding:2px 8px; border-radius:2px; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; letter-spacing:0}
.vlive{position:absolute; right:7px; top:7px; width:8px; height:8px; border-radius:50%; background:#FF4D6D; box-shadow:0 0 7px #FF4D6D; animation:blink 1.4s infinite}
.spr-box{position:relative; width:48px; height:44px}
.me-sprite{position:absolute; top:0; left:0; width:4px; height:4px; image-rendering:pixelated}
.memo{background:#FFF9F1; border:3px solid #17171C; border-radius:8px; box-shadow:5px 5px 0 rgba(0,0,0,.4); min-width:0}
/* 메모 버튼 — 쇼츠식 우측 레일 (모바일 스포트 영상 안에서만 보임) */
.vmemo{display:none; position:absolute; right:8px; bottom:108px; z-index:7; flex-direction:column; align-items:center;
  gap:2px; background:none; color:#fff; font-size:1.6rem; cursor:pointer;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.65))}
.vmemo::after{content:'메모'; font-size:.6rem; font-weight:700}
.vmemo:active{transform:scale(.92)}
.memo-hide{display:none; margin-left:10px; align-items:center; cursor:pointer; color:#8A7F6A; font-weight:800; font-size:.9rem}
.memo-hide:hover{color:#17171C}
.memo-head{display:flex; align-items:baseline; gap:8px; padding:12px 14px 9px; border-bottom:2px dashed #E2D6BE;
  font-size:.82rem; font-weight:800; color:#5A5244; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif}
.memo-head .mdate{margin-left:auto; font-size:.68rem; color:#A79C86; font-weight:700}
.memo-tools{display:flex; gap:3px; padding:6px 10px; border-bottom:2px dashed #E2D6BE}
.memo-tools button{min-width:26px; height:26px; padding:0 7px; border-radius:6px; font-size:.78rem; font-weight:800;
  color:#8A7F6A; display:flex; align-items:center; justify-content:center; cursor:pointer}
.memo-tools button:hover{background:#F3E9D8; color:#17171C}
.memo-body{padding:6px 16px 14px 36px; min-height:220px; overflow-y:auto; font-size:.9rem; outline:none; color:#3A3428;
  line-height:29px;
  background:
    linear-gradient(#E8B0A6,#E8B0A6) 26px 0/1.5px 100% no-repeat,
    repeating-linear-gradient(transparent 0 28px, rgba(23,23,28,.07) 28px 29px)}
.memo-body ul{margin:0; padding-left:1.15em}
.mcheck{display:flex; gap:8px; align-items:baseline}
.mcheck input{accent-color:#E86CA8; transform:translateY(1px)}
.mcheck:has(input:checked){text-decoration:line-through; color:#A79C86}
.memo-body:empty::before{content:attr(data-ph); color:#B0A793}
.memo-foot{padding:8px 14px; border-top:2px dashed #E2D6BE; font-size:.68rem; color:#A79C86; font-weight:700}
.mstamp{display:inline-block; font-size:.64rem; font-weight:800; background:#17171C; color:#FFE79A;
  padding:2px 8px; border-radius:3px; margin:6px 0 2px; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif}
.mscrap{border-left:3px solid #E86CA8; background:rgba(232,108,168,.09); padding:6px 10px; margin:6px 0;
  font-size:.84rem; line-height:1.6; border-radius:0 6px 6px 0}
.mscrap small{display:block; color:#8A8494; margin-top:3px; font-size:.7rem}
.pc-text{cursor:pointer}
.pc-text:hover{text-decoration:underline}

/* 강의 재생바 — 섹션이 끝나기 전엔 멈출 수 없어요 */
.vctrl{position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:10px; padding:22px 12px 9px;
  background:linear-gradient(transparent, rgba(10,8,16,.88))}
.vplay{font-size:1.3rem; color:#fff; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(242,109,156,.6))}
.vprog{flex:1; height:11px; border-radius:5px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden}
.vprog i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#FF9DBE); border-radius:5px; transition:width .25s linear}
.vtime{font-size:.85rem; color:#FFD9E8; flex-shrink:0; font-family:'NeoDunggeunmo',sans-serif; letter-spacing:0}

/* 강의 시작 — 소리 있는 재생은 사용자 탭이 필요해요 */
.vstart{position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; cursor:pointer;
  background:radial-gradient(120% 80% at 50% 40%, rgba(46,35,64,.35), rgba(23,19,31,.72)); backdrop-filter:blur(1.5px);
  color:#FFD9E8; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; font-size:.78rem; text-shadow:0 0 8px rgba(242,109,156,.7)}
.vstart.hide{display:none}
.vstart-btn{width:76px; height:76px; border-radius:50%; background:var(--accent); border:3px solid #17131F; color:#fff; font-size:1.9rem;
  display:flex; align-items:center; justify-content:center; padding-left:5px; box-shadow:0 6px 0 var(--accent-d), 0 0 26px rgba(242,109,156,.65); transition:transform .1s}
.vstart:hover .vstart-btn{transform:scale(1.06)}
.vstart:active .vstart-btn{transform:translateY(3px); box-shadow:0 3px 0 var(--accent-d), 0 0 26px rgba(242,109,156,.65)}
/* 섹션 종료 선택 */
.sec-overlay{position:fixed; inset:0; z-index:80; background:rgba(20,15,28,.72); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center}
.sec-overlay.show{display:flex}
.sec-card{background:var(--paper); border:3px solid #17171C; border-radius:8px; box-shadow:8px 8px 0 rgba(0,0,0,.5); padding:30px 32px; text-align:center; width:min(420px,90vw); animation:rise .3s ease}
.sec-card .se{font-size:44px; margin-bottom:10px}
.sec-card h2{font-size:1.3rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:8px}
.sec-card p{font-size:.86rem; color:#7A7264; line-height:1.65; margin-bottom:20px}
.sec-card .btns{display:flex; flex-direction:column; gap:9px}
.sec-card.wide{width:min(880px,94vw); text-align:left; position:relative}
.ao-timer{position:absolute; top:16px; right:18px; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; letter-spacing:0;
  font-size:.95rem; color:#8A2D55; background:#FBE4EE; border:2px solid #17131C; padding:4px 12px; border-radius:5px}
.ao-timer.hot{background:#FF4D6D; color:#fff; animation:blink 1s infinite}
.miss-item{display:flex; align-items:center; gap:10px; border:2px dashed #E0CFA8; background:#FDF8EC; border-radius:6px;
  padding:11px 13px; margin-bottom:8px; font-size:.86rem; font-weight:600; text-align:left}
.miss-item .sp{flex:1}
.ao-grid{display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:14px; align-items:start}
@media(max-width:640px){.ao-grid{grid-template-columns:1fr}}
.ao-peers{display:flex; flex-direction:column; gap:10px}
.pc-cap{font-size:.7rem; font-weight:800; color:#A8834A}
.peer-card{border:2px solid #17171C; border-radius:6px; background:#FDF8EC; padding:9px 11px}
.pc-name{font-size:.66rem; font-weight:700; color:#C24C78; display:flex; align-items:center; gap:6px; margin-bottom:6px}
.pc-live{width:6px; height:6px; border-radius:50%; background:#FF4D6D; animation:blink 1.4s infinite}
.pc-svg{display:block; width:100%; background:#fff; border-radius:4px; border:1px solid #E8DFD2}
.pc-svg path{stroke-dasharray:340; stroke-dashoffset:340; animation:drawpath 2.8s ease forwards}
@keyframes drawpath{to{stroke-dashoffset:0}}
.pc-text{font-size:.76rem; line-height:1.6; color:#5A5244; min-height:40px}
.pc-text::after{content:"▌"; color:#C24C78; animation:blink 1s infinite}
.ao-ta{width:100%; font:inherit; font-size:.98rem; border:3px solid #17171C; border-radius:6px; padding:16px 18px; background:#fff; min-height:280px; resize:vertical; line-height:1.85}
.ao-ta:focus{outline:3px solid var(--accent-soft)}
.sec-card.wide .gate{margin-top:16px}
.pbtn.gray{background:#8B95A1; border-color:#6B7684; box-shadow:0 4px 0 #6B7684}
.pbtn.gray:active{box-shadow:0 1px 0 #6B7684}
.pbtn.center{justify-content:center; width:100%}

.vsec{position:absolute; left:10px; top:10px; background:rgba(23,19,31,.88); color:#fff; font-size:.78rem; padding:3px 9px; border-radius:2px; font-family:'NeoDunggeunmo','Pretendard Variable',sans-serif; letter-spacing:0}
/* 강의 헤더 — 구글풍: 오버라인 + 큰 제목, 무대 왼쪽 라인에 좌정렬 */
.lec-head{grid-area:head; text-align:left; margin:0}
.lh-over{margin:0; font-size:.74rem; font-weight:600; color:#9C8FB8; letter-spacing:.02em}
.lh-title{margin:4px 0 0; font-size:1.5rem; font-weight:700; color:#fff; letter-spacing:-0.015em;
  font-family:"Pretendard Variable",sans-serif; line-height:1.3}

/* 진행 오브 레일 */
.rail{display:flex; align-items:center; justify-content:center; gap:8px; margin:16px 0 22px}
.orb{width:26px; height:26px; border-radius:50%; border:3px solid #17171C; background:#3A2E4E; position:relative; overflow:hidden; flex-shrink:0}
.orb i{position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(180deg,var(--accent),#FF9DBE); transition:height .5s ease}
.orb.done i{height:100%}
.orb.cur{border-color:#FFD9E8; box-shadow:0 0 10px rgba(242,109,156,.6)}
.rail .bar{width:14px; height:3px; background:#3A2E4E}

/* 함께 듣는 친구들 */
.classmates{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:-8px 0 18px}
.cm-live{display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:700; color:#FFD9E8; background:#17131F; border:2px solid #0B0912; border-radius:3px; padding:4px 10px}
.cm-live .dot{width:7px; height:7px; border-radius:50%; background:#FF4D6D; animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cm{display:inline-flex; align-items:center; gap:6px; font-size:.7rem; color:#D8CFE8; background:rgba(255,255,255,.08); border:2px solid rgba(11,9,18,.6); border-radius:3px; padding:4px 10px}
.cm .av{width:16px; height:16px; border-radius:50%; border:2px solid #17131C}
.cm b{color:#fff; font-weight:700}
.cm.done{opacity:.65}

/* 흔적 — 먼저 지나간 친구가 남긴 것 */
.trace{margin-top:14px; border:2px dashed #E0CFA8; border-radius:6px; background:#FDF8EC; padding:11px 14px}
.trace .t-label{font-size:.7rem; font-weight:800; color:#A8834A; margin-bottom:6px}
.trace p{font-size:.82rem; color:#5A5244; line-height:1.6}
.trace .peer{font-size:.85rem; font-weight:600; background:#fff; border:2px solid #17171C; border-radius:5px; padding:9px 12px; margin-top:6px; transition:filter .5s}
.trace .peer.blur{filter:blur(5px); user-select:none}
.trace svg{display:block; margin-top:4px}

/* 코치 실시간 대화 */
.cochat{margin-top:14px; background:#17131F; border:3px solid #0B0912; border-radius:6px; padding:10px 12px; max-height:132px; overflow-y:auto; display:flex; flex-direction:column; gap:7px}
.cochat:empty{display:none}
.co-msg{display:flex; gap:8px; align-items:flex-start; font-size:.78rem; color:#D8CFE8; line-height:1.5; animation:coin .3s ease}
@keyframes coin{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.co-msg .co-av{flex-shrink:0; font-size:15px}
.co-msg .co-who{display:block; font-size:.64rem; font-weight:700; color:#FF9DBE; margin-bottom:1px}
.co-msg svg{background:#fff; border-radius:4px; padding:2px; margin-top:2px}

/* 게이트 통과 응원 */
.cheer{position:fixed; z-index:95; font-size:.85rem; font-weight:700; background:#fff; border:2px solid #17131F; border-radius:4px; padding:7px 13px; box-shadow:3px 3px 0 rgba(0,0,0,.35); animation:cheerup 2.2s ease forwards; pointer-events:none}
@keyframes cheerup{0%{opacity:0; transform:translateY(14px)}15%{opacity:1; transform:none}80%{opacity:1}100%{opacity:0; transform:translateY(-22px)}}

/* 스텝 카드 */
.card{
  background:var(--paper); border:3px solid #17171C; border-radius:8px;
  box-shadow:8px 8px 0 rgba(0,0,0,.45); padding:26px 26px 24px; position:relative;
  animation:rise .4s ease;
}
@keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.step-label{font-size:.72rem; color:var(--accent-d); margin-bottom:10px}
.card h1{font-size:clamp(1.25rem,4vw,1.6rem); font-weight:800; letter-spacing:-0.03em; line-height:1.35; margin-bottom:6px}
.lede{font-size:.86rem; color:#7A7264; line-height:1.6; margin-bottom:18px}

/* 게이트 푸터 */
.gate{display:flex; align-items:center; gap:12px; margin-top:20px; padding-top:16px; border-top:2px dashed var(--line)}
.gate .hint{font-size:.8rem; color:var(--muted); flex:1}
.gate .hint.ready{color:var(--accent-d); font-weight:700}
.pbtn{display:inline-flex; align-items:center; gap:6px; font-size:.85rem; padding:10px 20px; border-radius:5px; background:var(--accent); color:#fff; border:2px solid var(--accent-d); box-shadow:0 4px 0 var(--accent-d); transition:transform .08s, box-shadow .08s, opacity .2s}
.pbtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-d)}
.pbtn:disabled{opacity:.35; cursor:not-allowed; transform:none}

/* 01 영상 */
.tv{background:#17131F; border:3px solid #0B0912; border-radius:6px; aspect-ratio:16/9; position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; overflow:hidden}
.tv .quote{color:#D8CFE8; font-size:.95rem; text-align:center; padding:0 30px; line-height:1.7}
.tv .playbtn{font-size:46px; color:#FFD9E8; filter:drop-shadow(0 0 10px rgba(242,109,156,.7)); transition:transform .15s}
.tv .playbtn:hover{transform:scale(1.12)}
.tv .vbar{position:absolute; bottom:0; left:0; right:0; height:6px; background:rgba(255,255,255,.12)}
.tv .vbar i{display:block; height:100%; width:0; background:var(--accent)}

/* 02 그리기 */
.padwrap{border:3px solid #17171C; border-radius:6px; background:#fff; overflow:hidden}
canvas{display:block; width:100%; height:200px; touch-action:none; cursor:crosshair}
.colors{display:flex; gap:8px; margin-top:12px}
.colors button{width:30px; height:30px; border-radius:50%; border:3px solid transparent}
.colors button.sel{border-color:#17171C}

/* 03 읽기 */
.reader{border:3px solid #17171C; border-radius:6px; background:#fff; height:340px; overflow-y:auto; padding:22px 26px}
.reader p{font-size:.94rem; line-height:2; color:#3A3428; margin-bottom:16px}
.reader p b{background:linear-gradient(transparent 58%, #FFE0A3 58%)}
.reader{cursor:text; user-select:text; -webkit-user-select:text}
.reader mark.hl{background:linear-gradient(transparent 45%, #FFE08A 45%); color:inherit; padding:0 1px; border-radius:2px}
.reader ::selection{background:#FFE9B8}
.reader .friend-ul{border-bottom:2px dotted var(--accent)}
.reader p.my-ul{background:linear-gradient(transparent 62%, #FFE0A3 62%)}
.reader p.friend-ul{border-bottom:2px dotted var(--accent)}
.reader .ful{display:block; font-size:.68rem; color:var(--accent-d); margin-top:4px; font-weight:700}

/* 04 말하기 */
.say{background:#fff; border:3px solid #17171C; border-radius:6px; padding:22px; text-align:center}
.say .line{font-family:inherit; font-size:1.05rem; line-height:1.8; margin-bottom:18px}
.holdbtn{font-size:.9rem; font-weight:700; padding:14px 26px; border-radius:50px; background:var(--accent-soft); color:var(--accent-d); border:3px solid var(--accent-d); position:relative; overflow:hidden; user-select:none}
.holdbtn .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(242,109,156,.35)}
.holdbtn span{position:relative}

/* 05 PLAY */
.playbox textarea{width:100%; font-family:inherit; font-size:1rem; border:3px solid #17171C; border-radius:6px; padding:14px 16px; background:#fff; min-height:110px; resize:vertical; line-height:1.8}
.playbox textarea:focus{outline:3px solid var(--accent-soft)}

/* 퀴즈 */
.quizbox{background:#fff; border:3px solid #17171C; border-radius:6px; padding:18px 20px}
.quiz-q{font-size:.95rem; font-weight:800; margin-bottom:12px; line-height:1.6}
.qopts{display:flex; flex-direction:column; gap:8px}
.qopt{text-align:left; font-size:.86rem; font-weight:600; padding:11px 14px; border:2px solid #17171C; border-radius:6px; background:#FDF8EC; transition:.12s}
.qopt:hover{background:#FFF3D9}
.qopt.good{background:var(--accent); color:#fff; border-color:var(--accent-d)}
.qopt.bad{background:#F2E3E3; color:#B03A3A; border-color:#B03A3A; opacity:.7}
.qopt.pick{background:#FBE4EE; border-color:var(--accent-d)}
.qq{margin-bottom:16px} .qq:last-child{margin-bottom:0}
.quiz-q small{color:#A8834A; font-weight:700; font-size:.74rem}
.qcheck{margin-top:12px; width:100%; font-size:.85rem; font-weight:700; padding:11px 16px; border:2px solid #17171C; border-radius:5px; background:#FDF8EC}
.qcheck:hover{background:#FFF3D9}
.qcheck:disabled{opacity:.4; cursor:not-allowed}
.q-verdict{margin-top:8px; font-size:.8rem; font-weight:800; display:none}
.q-verdict.good{display:block; color:#1B9E80}
.q-verdict.bad{display:block; color:#C0392B}

/* 06 마무리 */
.fin .field{margin-bottom:12px}
.fin label{display:block; font-size:.74rem; font-weight:700; color:#7A7264; margin-bottom:6px}
.fin input{width:100%; font-family:inherit; font-size:.95rem; border:3px solid #17171C; border-radius:6px; padding:12px 14px; background:#fff}
.fin .chk{display:flex; align-items:center; gap:9px; font-size:.85rem; margin-top:6px}
.fin .chk input{width:18px; height:18px; accent-color:var(--accent)}

/* 완료 */
.done-wrap{text-align:center; padding:14px 0 6px}
.done-orb{width:110px; height:110px; border-radius:50%; margin:0 auto 18px; border:4px solid #17171C; position:relative; overflow:hidden; background:#fff}
.done-orb i{position:absolute; left:-10%; right:-10%; bottom:0; height:0; background:linear-gradient(180deg,var(--accent),#FF9DBE); transition:height 1.2s ease; border-radius:40% 45% 0 0}
.done-orb.fill i{height:105%}
.done-orb .emo{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px}
.done-wrap h1{margin-bottom:8px}
.done-wrap .sub{font-size:.86rem; color:#7A7264; line-height:1.7; margin-bottom:18px}
.outdots{display:flex; justify-content:center; gap:7px; margin:0 0 18px}
.outdots span{width:30px; height:30px; border-radius:50%; border:3px solid #17171C; background:#F2EBDD; display:flex; align-items:center; justify-content:center; font-size:.75rem; color:#B0A793}
.outdots span.on{background:var(--accent); color:#fff}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(90px); z-index:90;
  background:#17131F; color:#FFF; border:2px solid #0B0912; font-size:.82rem; font-weight:600;
  padding:11px 20px; border-radius:4px; box-shadow:4px 4px 0 rgba(0,0,0,.4); transition:transform .25s ease; text-align:center; max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="bg-night"></div>

</header>

<!-- 목차 · 커리큘럼 드로어 -->
<div class="menu-drawer" id="menuDrawer" aria-label="목차와 커리큘럼">
  <div class="md-group">
    <div class="md-label">이 강의 · 1강 전략 설정</div>

<div class="stage">

      <video id="lecVid" src="assets/lecture1.mp4" poster="assets/lecture1-poster.jpg" playsinline preload="metadata"></video>

      <div class="vid"><video id="coachB" src="assets/coach-record.mp4" muted loop playsinline preload="auto"></video><span class="vtag">🐢 기록 코치</span><span class="vlive"></span></div>

      <div class="memo-tools" id="memoTools">
        <button data-mt="bold" title="굵게"><b>B</b></button>
        <button data-mt="hl" title="형광펜"><span style="background:#FFE79A;padding:0 3px">가</span></button>
        <button data-mt="check" title="체크리스트">☑</button>
        <button data-mt="list" title="글머리표">•</button>
      </div>
      <div class="memo-body" id="memoBody" contenteditable="true" data-ph="수업 들으며 자유롭게 적어요… (코치의 말을 누르면 여기 담겨요)"></div>

  <div class="sec-card">

    <h2 id="soTitle">섹션 1 끝!</h2>
    <p id="soText">다음 섹션으로 넘어갈까요?<br>아직 학습이 더 필요하다면, 다시 들어볼 수도 있어요.</p>
    <div class="btns">
      <button class="pbtn center" id="soNext">다음 섹션으로 →</button>
      <button class="pbtn center gray" id="soReplay">🔁 다시 들어볼래요</button>

</div>

<div class="sec-overlay" id="actOverlay">
  <div class="sec-card wide">
    <div class="step-label" id="aoLabel"></div>
    <span class="ao-timer" id="aoTimer">⏱ 0:00</span>
    <h2 id="aoTitle"></h2>
    <p id="aoText" style="text-align:left; margin-bottom:14px"></p>
    <div id="aoBody"></div>
    <div class="gate"><span class="hint" id="aoHint"></span>
    <button class="pbtn" id="aoDone" disabled>시간이 끝나면 다 같이 나가요</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── 노션풍 메모 저장 ─── */
(function(){
  const memo = document.getElementById('memoBody');
  memo.innerText = localStorage.getItem('trus_memo') || '';
  memo.addEventListener('input', ()=>localStorage.setItem('trus_memo', memo.innerText));
})();

/* ─── 강의 흐름 — 각 강의 영상을 통으로 본 뒤 활동으로 이어져요 ─── */
const BLOCKS = [
  {type:'lecture', name:'강의', t:'오늘, 잠깐 멈추는 시간', src:'assets/lecture1.mp4', poster:'assets/lecture1-poster.jpg'},
  {type:'interactive', kind:'read',  name:'인터랙티브 — 밑줄 읽기', t:'오늘의 글, 밑줄 치며 읽기', dur:25},
  {type:'interactive', kind:'draw',  name:'인터랙티브 — 그림 그리기', t:'지금 마음을 색으로 그려보세요', dur:20},
  {type:'lecture', name:'강의', t:'전략을 바운더리로', src:'assets/lecture2.mp4', poster:'assets/lecture2-poster.jpg'},
  {type:'interactive', kind:'quiz',  name:'인터랙티브 — 잠깐, 퀴즈', t:'방금 이야기의 핵심은 무엇이었나요?', dur:25},
  {type:'interactive', kind:'speak', name:'인터랙티브 — 소리 내어 말하기', t:'방금 배운 것을 입으로 말해보세요', dur:18},
  {type:'interactive', kind:'write', name:'인터랙티브 — 글쓰기', t:'오늘 배운 것을 한 문장으로 적어보세요', ph:'오늘 나는 …라는 걸 알았다.', dur:20},
  {type:'interactive', kind:'play',  name:'인터랙티브 — PLAY 워크시트', t:'워크시트를 내려받아, 오늘 밤 따라 써보세요', dur:25},
  {type:'finish', name:'마무리 · 다시 듣기'},
];

let bi = 0, maxBi = 0, done = false, started = false;   // maxBi = 지금까지 도달한 최대 블록 (bi는 soReplay로 되감겨요)
const fmt = s => Math.floor(s/60) + ':' + String(Math.max(0,Math.round(s))%60).toString().padStart(2,'0');
const $ = id => document.getElementById(id);

/* ─── 실제 강의 영상 (세로 9:16) ─── */
const lecVid = $('lecVid');
const TEST_SEC = 4;                                     // 테스트: 각 강의 구간을 4초만 재생
let VID_DUR = 66;                                       // 로드되면 실제 길이로 갱신
lecVid.addEventListener('loadedmetadata', ()=>{
  if(isFinite(lecVid.duration) && lecVid.duration > 0){ VID_DUR = lecVid.duration; updateUI(); }
});

/* 코치 영상(바운더리·기록) — 강의 재생과 시작점을 맞물려요 */
const coachVids = [$('coachA'), $('coachB')];
function coachesStart(){ coachVids.forEach(v=>{ v.currentTime = 0; v.play().catch(()=>{}); }); }
function coachesPause(){ coachVids.forEach(v=>v.pause()); }

const effDur = () => Math.min(VID_DUR, TEST_SEC);
function updateUI(){
  const b = BLOCKS[bi];
  $('vSec').textContent = `${bi+1}/${BLOCKS.length} · ${b.type==='lecture' ? b.t : b.name}`;
  if(b.type==='lecture'){
    $('vFill').style.width = Math.min(100, lecVid.currentTime / effDur() * 100) + '%';
    $('vTime').textContent = '-' + fmt(Math.max(0, effDur() - lecVid.currentTime));
  }
}
function runBlock(){
  closeMenu();
  const b = BLOCKS[bi];
  maxBi = Math.max(maxBi, bi);
  updateUI();
  if(b.type==='lecture'){ playLecture(); }
  else { lecVid.pause(); coachesPause(); $('vPlay').textContent = '▶'; }
  /* 발화자 스포트라이트 — 강의 중엔 소정님, 인터랙티브 진입 땐 코치들이 차례로 말한다 */
  if(b.type==='lecture'){ clearSpotTimers(); spotlight(mainTile); }
  else if(b.type==='interactive'){ spotSeq([[coachTiles[0], 400], [coachTiles[1], 5400], [mainTile, 10400]]); }
  else { clearSpotTimers(); spotlight(mainTile); }
  if(b.type==='gate') showGate(false);
  if(b.type==='interactive') showInteractive(b);
  if(b.type==='finish') showGate(true);
}
function playLecture(){
  const b = BLOCKS[bi];
  if(b.src && !lecVid.currentSrc.endsWith(b.src)){   // 이 강의의 영상으로 교체 → 0부터
    lecVid.src = b.src;
    if(b.poster) lecVid.poster = b.poster;
    lecVid.load();
  } else if(lecVid.currentTime >= effDur() - 0.1){   // 같은 영상 다시 듣기면 처음으로
    lecVid.currentTime = 0;
  }
  updateUI();
  if(started){
    lecVid.play().catch(()=>{}); $('vPlay').textContent = '⏸';
    coachesStart();                                  // 코치 영상도 0초부터 함께 시작
  }
}
/* 영상 재생에 맞춰 진행바·남은시간 갱신, 끝까지 다 보면 다음 활동으로 */
lecVid.addEventListener('timeupdate', ()=>{
  if(BLOCKS[bi].type !== 'lecture') return;
  updateUI();
  if(!lecVid.paused && lecVid.currentTime >= effDur() - 0.05){    // 테스트 4초 컷
    lecVid.pause();
    $('vFill').style.width = '100%'; $('vTime').textContent = '끝';
    nextBlock();
  }
});
lecVid.addEventListener('ended', ()=>{
  if(BLOCKS[bi].type === 'lecture'){ $('vFill').style.width='100%'; $('vTime').textContent='끝'; nextBlock(); }
});
function nextBlock(){
  if(bi >= BLOCKS.length - 1) return;
  bi++; runBlock();
}

/* 첫 재생은 사용자 탭이 있어야 소리와 함께 시작돼요 */
$('vStart').addEventListener('click', ()=>{
  started = true;
  lecVid.muted = false;
  $('vStart').classList.add('hide');
  playLecture();
});
/* 강의는 멈추거나 건너뛸 수 없어요 — 끝까지 들어야 다음으로 넘어가요 */
function blockMsg(){
  if(done || BLOCKS[bi].type !== 'lecture') return;
  toast(`강의는 멈추거나 건너뛸 수 없어요 — 남은 시간 ${fmt(Math.max(0, effDur() - lecVid.currentTime))}`);
}
$('vPlay').addEventListener('click', ()=>{
  if(!started){ $('vStart').click(); return; }   // 소리와 함께 첫 재생만 허용
  blockMsg();
});
$('vProg').addEventListener('click', blockMsg);

/* 섹션 넘어가기 · 마무리 화면 */
let gateMode = 'gate';
function showGate(isFinish){
  gateMode = isFinish ? 'finish' : 'gate';
  $('soEmo').textContent = isFinish ? '🎓' : '🎬';
  $('soTitle').textContent = isFinish ? '마지막 섹션까지 다 들었어요!' : '여기까지 잘 들었어요!';
  $('soText').innerHTML = isFinish
    ? '이대로 강의를 마무리할까요?<br>아직 학습이 더 필요하다면, 처음부터 다시 들을 수도 있어요.'
    : '다음 섹션으로 넘어갈까요?<br>아직 학습이 더 필요하다면, 다시 들어볼 수도 있어요.';
  $('soNext').textContent = isFinish ? '🎓 강의 마무리하기' : '다음 섹션으로 →';

function initPad(){
  const cv = $('pad');
  const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = 400;
  const ctx = cv.getContext('2d'); ctx.scale(2,2); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#F26D9C';
  let drawing = false, drew = 0;
  const pos = e => { const b = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [t.clientX - b.left, t.clientY - b.top]; };
  const start = e => { drawing = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); };
  const move = e => {
    if(!drawing) return;
    const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke();
    if(++drew === 12){
      $('aoDone').disabled = false;
      const h = $('aoHint'); h.textContent = '예쁘네요! 완료할 수 있어요'; h.classList.add('ready');
    }
    e.preventDefault();
  };
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move);
  window.onmouseup = ()=>drawing=false;
  cv.addEventListener('touchstart', start); cv.addEventListener('touchmove', move); cv.addEventListener('touchend', ()=>drawing=false);
  document.querySelectorAll('#colors button').forEach(btn=>btn.addEventListener('click', ()=>{
    document.querySelectorAll('#colors button').forEach(x=>x.classList.remove('sel'));
    btn.classList.add('sel'); ctx.strokeStyle = btn.style.background;
  }));
}

let actTimer = null, actLeft = 0, actMet = false;
const missed = [];                                       // 시간 안에 못 채운 활동들
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = .12;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}
function startActTimer(sec){
  clearInterval(actTimer);
  actLeft = sec;
  const t = $('aoTimer');
  t.classList.remove('hot');
  t.textContent = '⏱ ' + fmt(actLeft);
  actTimer = setInterval(()=>{
    actLeft--;
    t.textContent = '⏱ ' + fmt(Math.max(0, actLeft));
    if(actLeft === 10){ t.classList.add('hot'); beep(); toast('10초 남았어요 — 마무리해 주세요!'); }
    if(actLeft <= 0){ clearInterval(actTimer); endInteractive(); }
  }, 1000);
}

}

  $('doneHost').innerHTML = `<div class="card done-wrap">
    <div style="font-size:44px; margin-bottom:10px">⏳</div>
    <h1>거의 다 왔어요 — 못 채운 활동이 있어요</h1>
    <p class="sub">시간 안에 못 마친 활동을 완료해서 올려야<br><b>다음 에피소드가 열려요.</b></p>
    <div style="text-align:left; max-width:440px; margin:0 auto 6px">
      ${missed.map((m,k)=>`<div class="miss-item"><span>${MISS_LABEL[m.kind] || m.kind}</span><span style="color:#7A7264; font-weight:500">${m.t}</span><span class="sp"></span>
        <button class="pbtn" style="padding:7px 14px; font-size:.78rem" onclick="clearMiss(${k})">완료하고 올리기</button></div>`).join('')}
    </div>
  </div>`;
  $('doneHost').scrollIntoView({behavior:'smooth'});
}
function clearMiss(k){
  missed.splice(k,1);
  toast('올라갔어요 ✓');
  if(missed.length) showMissed();
  else realFinish();
}
function realFinish(){
  done = true;
  lecVid.pause();
  coachesPause();
  CURRICULUM[4].state = 'done';                             // 5단계 완료 — 드로어 커리큘럼도 완강 상태로 갱신
  renderCurriculum();
  localStorage.setItem('trus_lecture_complete','1');
  $('vPlay').textContent = '✓';
  $('vTime').textContent = '끝';
  $('doneHost').innerHTML = `<div class="card done-wrap">
    <div class="done-orb" id="dorb"><i></i><span class="emo">🎓</span></div>
    <h1>일의 프레임이 완성됐어요 — 완강!</h1>
    <div class="outdots"><span class="on">✓</span><span class="on">✓</span><span class="on">✓</span><span class="on">✓</span><span class="on">✓</span></div>
    <p class="sub">다섯 조각이 모두 채워져 나만의 일의 프레임이 됐어요.</p>
    <div style="margin:0 0 16px; padding:12px 16px; border:3px solid #17171C; border-radius:6px; background:#FBE4EE; font-size:.85rem; font-weight:700; color:#8A2D55; box-shadow:3px 3px 0 rgba(0,0,0,.15)">
      📦 오프라인 책 『일의 교과서』가 집으로 출발했어요<br><span style="font-weight:500; font-size:.76rem">여정을 끝낸 사람에게만 오는 졸업장이에요</span></div>
    <div style="margin:0 0 16px; padding:12px 16px; border:3px solid #17171C; border-radius:6px; background:#E7F6EE; font-size:.85rem; font-weight:700; color:#1F5D3A; box-shadow:3px 3px 0 rgba(0,0,0,.15)">
      ⛲ 광장 문이 열렸어요!<br><span style="font-weight:500; font-size:.76rem">광장은 100% 완강한 사람들만 들어갈 수 있는 공간이에요</span></div>
    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
      <button class="pbtn" onclick="location.href='plaza-prototype.html'">⛲ 광장 입장하기</button>
      <button class="pbtn" style="background:#8B95A1; border-color:#6B7684; box-shadow:0 4px 0 #6B7684" onclick="location.href='myspace-prototype.html'">🏠 마이스페이스로</button>
    </div>
  </div>`;
  setTimeout(()=>$('dorb').classList.add('fill'), 100);
  toast('전체 섹션 100% 완강 — 광장이 열렸어요 ◗ +1');
  $('doneHost').scrollIntoView({behavior:'smooth'});
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3000);
}

/* ===== ☰ 목차 드로어 ===== */
const menuToggle = $('menuToggle');
const menuDrawer = $('menuDrawer');
function menuOpen(){ return menuDrawer.classList.contains('open'); }
function closeMenu(){
  menuDrawer.classList.remove('open');
  menuToggle.setAttribute('aria-expanded','false');
}
function openMenu(){
  if(document.querySelector('.sec-overlay.show')) return;   // 게이트·인터랙티브 화면이 떠 있으면 열지 않아요
  renderToc();
  menuDrawer.classList.add('open');
  menuToggle.setAttribute('aria-expanded','true');
}
/* 목차 항목 상태 — 위에서부터 먼저 걸리는 조건이 우선이에요 */
function tocState(i){
  if(i === bi)    return 'now';
  if(i <= maxBi)  return 'done';
  return 'lock';
}
function renderToc(){
  $('tocList').innerHTML = BLOCKS.map((b,i)=>{
    const st = tocState(i);
    const ic = st==='now' ? '▶' : st==='done' ? '✓' : '🔒';
    const label = b.type==='lecture' ? b.t : b.name;
    // 잠긴 항목도 클릭은 받아요 — 왜 못 여는지 토스트로 알려주려고요 (disabled면 클릭이 안 잡혀요)
    return `<button class="md-item toc-item ${st}" data-i="${i}"`
      + (st==='lock' ? ' aria-disabled="true"' : '')
      + (st==='now'  ? ' aria-current="step"' : '')
      + `><span class="md-ic">${ic}</span><span class="md-name">${i+1}. ${label}</span></button>`;
  }).join('');
}
function jumpTo(i){
  if(i === bi){ closeMenu(); return; }                      // 지금 블록 — 다시 시작하지 않아요 (강의는 되감기 대상이 아니에요)
  if(i > maxBi){ toast('앞 블록을 먼저 마쳐야 열려요'); return; }
  bi = i; runBlock(); closeMenu();
}
$('tocList').addEventListener('click', e=>{
  const btn = e.target.closest('.toc-item');
  if(!btn) return;
  jumpTo(Number(btn.dataset.i));
});
/* 커리큘럼 5단계 — 표시 전용이에요 (강의 페이지가 하나뿐이라 이동은 안 걸어요) */
const CURRICULUM = [
  {n:1, name:'바운더리 설정', prod:'나의 바운더리', state:'done'},
  {n:2, name:'숫자언어',      prod:'숫자언어',      state:'done'},
  {n:3, name:'고객언어',      prod:'고객언어',      state:'done'},
  {n:4, name:'문제정의',      prod:'문제 한 문장',  state:'done'},
  {n:5, name:'전략 설정',     prod:'3개월 전략',    state:'now'},
];
function renderCurriculum(){
  $('curList').innerHTML = CURRICULUM.map(c=>
    `<div class="md-item cur-item ${c.state}"`
    + (c.state==='now' ? ' aria-current="step"' : '')
    + `><span class="md-ic">${c.state==='done' ? '✓' : '▶'}</span>`
    + `<span class="md-name">${c.n}. ${c.name}<small>${c.prod}</small></span>`
    + (c.state==='done' ? '<span class="cur-badge">제출 완료</span>' : '')
    + `</div>`).join('');
}
renderCurriculum();
menuToggle.addEventListener('click', e=>{ e.stopPropagation(); menuOpen() ? closeMenu() : openMenu(); });
document.addEventListener('click', e=>{
  if(menuOpen() && !menuDrawer.contains(e.target) && !menuToggle.contains(e.target)) closeMenu();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && menuOpen()) closeMenu(); });

/* 스튜디오 미리보기: ?preview=read|draw|quiz|speak|write|play → 해당 인터랙티브 화면만 */
const PV = new URLSearchParams(location.search).get('preview');
if(PV){
  const pidx = BLOCKS.findIndex(x=>x.type==='interactive' && x.kind===PV);
  if(pidx >= 0){
    bi = pidx;
    $('vStart').classList.add('hide');
    runBlock();
  } else runBlock();
} else runBlock();

/* ─── 발화자 스포트라이트 — 말하는 사람이 중앙 세로형으로, 청자는 사이드 가로형으로 ─── */
const spotSlotEl = $('spotSlot'), sideSlotEl = $('sideSlot');
const mainTile = document.querySelector('.vid.main');
const coachTiles = coachVids.map(v => v.closest('.vid'));
let spotTimers = [];
function clearSpotTimers(){ spotTimers.forEach(clearTimeout); spotTimers = []; }
function spotlight(el){
  if(!el || el.parentElement === spotSlotEl) return;
  const playing = [lecVid, ...coachVids].filter(v => !v.paused);
  const old = spotSlotEl.firstElementChild;
  if(old) sideSlotEl.prepend(old);
  spotSlotEl.appendChild(el);
  playing.forEach(v => v.play().catch(()=>{}));       /* DOM 이동으로 멈춘 영상 재개 */
  const cv = el.querySelector('video');
  if(cv && cv !== lecVid) cv.play().catch(()=>{});    /* 스포트로 온 코치는 살아 움직이게 */
  [old, el].forEach(t => { if(!t) return; t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); });
}
function spotSeq(steps){ clearSpotTimers(); steps.forEach(([el, at]) => spotTimers.push(setTimeout(() => spotlight(el), at))); }
sideSlotEl.addEventListener('click', e => {
  const v = e.target.closest('.vid');
  if(v){ clearSpotTimers(); spotlight(v); }
});

/* ─── 남는 메모장 — 자동 저장 · 대목 도장 · 코치 말 스크랩 ─── */
const memoBody = $('memoBody');
const MEMO_KEY = 'trus_lecture_memo';
try{
  const m = JSON.parse(localStorage.getItem(MEMO_KEY));
  if(m && m.v === 1 && m.html) memoBody.innerHTML = m.html;
}catch(e){}
$('memoDate').textContent = new Date().toLocaleDateString('ko-KR', { month:'long', day:'numeric' });
let memoTimer = null;
function saveMemo(){
  try{ localStorage.setItem(MEMO_KEY, JSON.stringify({ v:1, html: memoBody.innerHTML })); }
  catch(e){ toast('메모 저장 실패 — 브라우저 저장 공간을 확인해요'); }
}
memoBody.addEventListener('input', () => { clearTimeout(memoTimer); memoTimer = setTimeout(saveMemo, 700); });
/* 대목 도장 — 새 블록에서 메모를 시작하면 지금 듣던 대목이 자동으로 찍혀요 */
let lastStampBi = -1;
memoBody.addEventListener('focus', () => {
  if(bi === lastStampBi) return;
  lastStampBi = bi;
  const b = BLOCKS[bi];
  const at = b.type === 'lecture' ? ` · ${fmt(lecVid.currentTime)}` : '';
  memoBody.insertAdjacentHTML('beforeend',
    `<div class="mstamp" contenteditable="false">${bi + 1}블록 · ${b.type === 'lecture' ? b.t : b.name}${at}</div><div><br></div>`);
  const r = document.createRange(); r.selectNodeContents(memoBody); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  saveMemo();
});
/* 모바일 — 재생바 💬로 메모 바텀시트 여닫기 */
$('vMemoBtn').addEventListener('click', e => { e.stopPropagation(); document.body.classList.toggle('memo-open'); });
$('memoHide').addEventListener('click', () => document.body.classList.remove('memo-open'));

/* 노션풍 메모 툴바 — 굵게·형광·체크리스트·글머리표 */
function memoCaretEnd(){
  const sel = getSelection();
  if(!sel.rangeCount || !memoBody.contains(sel.anchorNode)){
    const r = document.createRange(); r.selectNodeContents(memoBody); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
}
$('memoTools').addEventListener('click', e => {
  const b = e.target.closest('[data-mt]');
  if(!b) return;
  memoBody.focus(); memoCaretEnd();
  const k = b.dataset.mt;
  if(k === 'bold') document.execCommand('bold');
  else if(k === 'hl') document.execCommand('hiliteColor', false, '#FFE79A');
  else if(k === 'list') document.execCommand('insertUnorderedList');
  else if(k === 'check') document.execCommand('insertHTML', false,
    '<div class="mcheck"><input type="checkbox"><span>&nbsp;</span></div>');
  clearTimeout(memoTimer); memoTimer = setTimeout(saveMemo, 500);
});
/* 체크 상태는 attribute로 박아야 innerHTML 저장에 남아요 */
memoBody.addEventListener('change', e => {
  if(e.target.matches('.mcheck input')){
    if(e.target.checked) e.target.setAttribute('checked', ''); else e.target.removeAttribute('checked');
    saveMemo();
  }
});

/* 코치 말 스크랩 — 옆에 뜨는 코치의 말을 누르면 인용으로 담겨요 */
document.addEventListener('click', e => {
  const pt = e.target.closest('.pc-text');
  if(!pt) return;
  const card = pt.closest('.peer-card');
  const name = card ? card.querySelector('.pc-name').textContent.trim() : '';
  const text = pt.dataset.full || pt.textContent;
  if(!text.trim()) return;
  memoBody.insertAdjacentHTML('beforeend',
    `<div class="mscrap" contenteditable="false">❝ ${text}<small>${name}</small></div><div><br></div>`);
  saveMemo();
  toast('코치의 말을 메모장에 담았어요 ✍️');
});
</script>
</body>
</html>
