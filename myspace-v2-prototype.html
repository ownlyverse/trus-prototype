<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바운더리 타운 — 마이스페이스 (1차 오픈안)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* ===== 1. 토큰 · 레이아웃 ===== */
:root{
  --paper:#FFFFFF; --ink:#37352F; --muted:#6E6D69; --faint:#9B9B97;
  --line:#E9E9E7; --bg:#F7F7F5;
  --indigo:#5B5BD6; --indigo-soft:#EEF0FF; --indigo-ink:#3F3FB0;
  --ok:#22A06B; --warn:#F5A623; --danger:#E5484D;
  --radius:10px; --shadow:0 4px 16px rgba(25,31,40,.06);
  --popover:0 8px 24px rgba(15,15,15,.12);
  --side-w:240px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
/* 사이드바 */
.side{width:var(--side-w);flex:none;background:var(--bg);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side .me{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.side .me b{font-size:14px}
.side .stage{display:inline-block;font-size:11px;font-weight:600;color:var(--indigo-ink);background:var(--indigo-soft);border-radius:999px;padding:2px 8px;cursor:pointer;margin-top:4px}
.side h4{margin:14px 8px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.side .nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:3px 8px;font-size:14px;color:var(--ink);text-decoration:none;word-break:keep-all}
.side .nav:hover{background:rgba(25,31,40,.05)}
.side .nav.on{background:rgba(25,31,40,.06);color:var(--ink);font-weight:600}
.side .nav small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.side .nav.sub{padding-left:24px;font-size:14px}
.side .nav[disabled]{color:var(--faint);cursor:not-allowed}
.side .foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.side .foot .lec-btn{display:block;text-align:center;background:var(--indigo);color:var(--paper);text-decoration:none;font-size:13px;font-weight:600;border-radius:6px;padding:9px 10px;word-break:keep-all}
.side .foot .lec-btn:hover{background:var(--indigo-ink)}
.side .foot .lec-sub{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
/* 문서 */
.doc{flex:1;min-width:0;padding:0 40px 120px}
.doc-in{max-width:720px;margin:0 auto}
.doc-head{padding:64px 0 24px;border-bottom:1px solid var(--line)}
.doc-head h1{margin:0;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.2;word-break:keep-all;cursor:text;border-radius:4px;padding:2px 4px;margin-left:-4px}
.doc-head h1:hover{background:rgba(25,31,40,.03)}
.doc-head h1:focus{outline:2px solid var(--indigo);outline-offset:2px}
.doc-head h1:empty::before{content:attr(data-ph);color:var(--faint)}
.props{margin-top:18px}
.prop{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:14px;word-break:keep-all}
.prop-k{flex:none;width:120px;color:var(--muted);font-size:13px}
.prop-v{color:var(--ink)}
.prop-period{cursor:pointer;border-radius:4px;padding:1px 5px;margin:0 -5px}
.prop-period:hover{background:rgba(25,31,40,.05)}
.prop-period:focus{outline:2px solid var(--indigo);outline-offset:1px}
.prop-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prop-edit input[type=date]{border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:13px;background:var(--paper)}
.prop-edit input[type=date]:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo)}
.prop-arrow{color:var(--muted)}
.prop-ok{border:0;background:var(--indigo);color:var(--paper);border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600}
.prop-cancel{border:0;background:none;color:var(--muted);border-radius:6px;padding:6px 8px;font-size:13px}
.prop-cancel:hover{background:rgba(25,31,40,.05)}
.prop-cancel:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.badge{display:inline-block;font-size:12px;font-weight:500;border-radius:4px;padding:1px 7px;background:rgba(25,31,40,.06);color:var(--muted)}
.menu-btn{display:none}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:rgba(25,31,40,.35);z-index:40}
/* ===== 2. 일의 공식 ===== */
.formula{position:static;background:var(--paper);border-bottom:1px solid var(--line);padding:28px 0 24px;margin-bottom:0}
.f-bar{position:sticky;top:0;height:0;z-index:5;overflow:visible}
.f-bar .f-summary{position:absolute;left:0;right:0;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 0}
.f-bar.on .f-summary{display:flex}
.sec-h{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:0 0 8px;word-break:keep-all}
.f-graph{position:relative;height:230px;margin-top:6px}
.f-graph svg{position:absolute;inset:0;width:100%;height:100%}
.f-arc{fill:none;stroke:var(--indigo);stroke-width:1.5;stroke-dasharray:5 5}
.formula.complete .f-arc{stroke-dasharray:none}
.f-line{stroke:var(--ink);stroke-width:1.5;opacity:.7}
.f-pt{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--indigo);transform:translate(-50%,-50%);top:52.2%}
.f-pt.l{left:6%}
.f-pt.r{left:94%}
.f-lab{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.f-problem{position:absolute;top:0;left:50%;transform:translateX(-50%);text-align:center;width:60%}
.f-chip{position:absolute;top:calc(52.2% - 12px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--indigo-ink);background:var(--indigo-soft);border-radius:6px;padding:3px 9px;white-space:nowrap;transition:background .2s}
.f-start{position:absolute;top:auto;bottom:0;left:5%;width:40%}
.f-end{position:absolute;top:auto;bottom:0;right:5%;width:40%;text-align:right}
.f-val{display:block;min-height:1.5em;outline:none;border-radius:4px;padding:1px 4px;margin:0 -4px;cursor:text;word-break:keep-all}
.f-val:hover{background:rgba(91,91,214,.06)}
.f-val:focus{background:var(--indigo-soft)}
.f-val:empty::before{content:attr(data-ph);color:var(--faint)}
.f-val.big{font-size:17px;font-weight:600}
.f-val.q{font-size:15px;font-weight:600}
.f-val.q:not(:empty)::before{content:'“'}
.f-val.q:not(:empty)::after{content:'”'}
.f-val.dim{opacity:.45}
.f-summary{display:none;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);cursor:pointer;padding-top:4px}
.f-summary b{color:var(--ink);font-weight:600}
/* ===== 3. 데일리 ===== */
.day{border:0;margin-bottom:6px}
.day-h{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.day-h::before{content:'▸';display:inline-block;color:var(--faint);font-size:12px;flex:none;transition:transform .15s ease}
.day.open .day-h::before{transform:rotate(90deg)}
.day-h b{font-size:18px;font-weight:600}
.day-h .prog{font-size:13px;color:var(--muted);margin-left:auto}
.miss{color:var(--danger);font-weight:600}
.day-h .miss{font-size:13px;margin-left:auto}
.side .nav small.miss{color:var(--danger)}
.day-h .peek{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.day.today .day-h{cursor:default}
.day.today .day-h::before{content:none}
.day.today.full .day-h .prog{color:var(--indigo-ink);font-weight:600}
.day-b{padding:2px 0 10px 16px}
.day:not(.today):not(.open) .day-b{display:none}
.it{display:flex;align-items:center;gap:10px;padding:3px 0}
.it-chk{width:16px;height:16px;accent-color:var(--indigo);flex:none}
.it-text{flex:1;border:0;background:none;outline:none;font-size:15px;padding:4px 2px}
.it-text::placeholder{color:var(--faint)}
.it.done .it-text{text-decoration:line-through;color:var(--faint)}
.keyq{font-size:15px;color:var(--ink);border-left:3px solid var(--ink);padding:2px 0 2px 14px;margin:0 0 16px;line-height:1.6;word-break:keep-all}
.it.frog .it-text{font-weight:600}
.it .frog-tag{font-size:11px;color:var(--indigo-ink);background:var(--indigo-soft);border-radius:4px;padding:1px 6px;flex:none}
.rv{margin-top:14px}
.rv .q{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.rv .q span{flex:1;color:var(--muted);word-break:keep-all}
.rv .ox{width:28px;height:26px;border:1px solid var(--line);background:none;border-radius:6px;font-size:12px;color:var(--muted)}
.rv .ox:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.rv .ox.on{border-color:var(--indigo);color:var(--indigo-ink);background:var(--indigo-soft);font-weight:700}
.rv textarea{display:block;width:100%;min-height:72px;resize:vertical;border:0;border-radius:4px;padding:8px;margin-top:8px;outline:none;line-height:1.7;font-size:15px}
.rv textarea::placeholder{color:var(--faint)}
.rv textarea:focus{background:rgba(25,31,40,.03)}
.rv .rv-act{display:flex;justify-content:flex-end}
.rv .rv-act button{border:0;background:none;color:var(--indigo-ink);padding:8px 6px;font-size:13px;font-weight:600}
.rv-sum{margin-top:12px;cursor:text}
.rv-sum .chips{display:flex;gap:6px;margin-bottom:6px}
.rv-sum .chip{font-size:11px;color:var(--muted);background:rgba(25,31,40,.05);border-radius:4px;padding:2px 7px}
.rv-sum .chip.on{color:var(--indigo-ink);background:var(--indigo-soft)}
.rv-sum .txt{font-size:15px;white-space:pre-wrap;line-height:1.7;word-break:keep-all}
.days .sec-h{margin-top:24px}
.dump{margin:4px 0 8px;padding:16px;background:var(--bg);border-radius:4px}
.dump .dump-title{font-size:15px;font-weight:600;margin:0 0 6px;word-break:keep-all}
.dump .dump-sub{font-size:12px;color:var(--muted);margin:0 0 8px}
.dump-in{display:flex;gap:6px}
.dump-in input{flex:1;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;outline:none;font-size:14px}
.dump-in input:focus{border-bottom-color:var(--indigo)}
.dump-in button{border:0;background:none;color:var(--indigo-ink);font-size:13px;font-weight:600;padding:4px 6px}
.dump-list{margin:8px 0 0}
.dump-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.dump-row .dump-chk{width:16px;height:16px;accent-color:var(--indigo)}
.dump-row .n{font-size:11px;color:var(--indigo-ink);background:var(--indigo-soft);border-radius:4px;padding:0 5px;min-width:16px;text-align:center}
.dump-row .n:empty{display:none}
.dump-row .t{flex:1}
.dump-row .dump-x{border:0;background:none;color:var(--faint);font-size:14px;padding:0 4px}
.dump-row .dump-x:hover{color:var(--danger)}
.dump-act{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dump-act .cnt{font-size:12px;color:var(--muted)}
.dump-act button{border:0;background:var(--indigo);color:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.dump-act button[disabled]{background:var(--faint);cursor:default}
.dropped{margin-top:10px;font-size:12.5px;color:var(--muted)}
.dropped summary{cursor:pointer;list-style:none}
.dropped summary::before{content:'▸ ';color:var(--faint)}
.dropped[open] summary::before{content:'▾ '}
.dropped ul{margin:4px 0 0 14px;padding:0}
.dropped li{text-decoration:line-through;color:var(--faint);padding:1px 0}
/* ===== 4. 코치 ===== */
.coach-bubble{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:var(--indigo);color:var(--paper);font-size:26px;box-shadow:0 8px 24px rgba(91,91,214,.35);z-index:50;display:flex;align-items:center;justify-content:center}
.coach-bubble .dot{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--paper)}
.coach-mini{position:fixed;right:92px;bottom:34px;max-width:280px;background:var(--paper);border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow);z-index:50}
.coach-panel{position:fixed;right:24px;bottom:92px;width:360px;height:560px;max-height:calc(100vh - 110px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--popover);z-index:55;display:flex;flex-direction:column;overflow:hidden}
.cp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-h b{font-size:14px}
.cp-h small{display:block;font-size:11px;color:var(--muted)}
.cp-h .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted)}
.cp-tabs{display:flex;border-bottom:1px solid var(--line)}
.cp-tabs button{flex:1;border:0;background:none;padding:9px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.cp-tabs button.on{color:var(--indigo-ink);font-weight:600;border-bottom-color:var(--indigo)}
.cp-body{flex:1;overflow:auto;padding:12px}
.msg{max-width:86%;margin:0 0 8px;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5}
.msg.c{background:var(--bg);border-bottom-left-radius:3px}
.msg.u{background:var(--indigo);color:var(--paper);margin-left:auto;border-bottom-right-radius:3px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;max-width:92%}
.card .why{font-size:12px;color:var(--muted);margin:2px 0 8px}
.card .add{border:0;background:var(--indigo);color:var(--paper);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.card .add[disabled]{background:var(--faint);cursor:default}
.card .swap{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.card .swap button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;font-size:12px}
.card .swap button.keep{color:var(--muted);border-style:dashed}
.cp-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.cp-in input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.cp-in input:focus{border-color:var(--indigo)}
.cp-in button{border:0;background:var(--indigo);color:var(--paper);border-radius:8px;padding:0 12px;font-weight:600}
.concept{border:1px solid var(--line);border-radius:10px;padding:14px}
.concept .k{font-size:11px;color:var(--muted)}
.concept h4{margin:2px 0 10px;font-size:15px}
.concept blockquote{margin:0 0 6px;padding-left:10px;border-left:3px solid var(--indigo-soft);color:var(--ink);font-size:13.5px}
.concept .ask{margin-top:12px;padding:10px;background:var(--indigo-soft);border-radius:8px;font-size:13.5px;color:var(--indigo-ink);font-weight:600}
.concept .add{margin-top:10px;border:0;background:var(--indigo);color:var(--paper);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600}
.concept-card .ask{color:var(--indigo-ink);font-weight:600}
/* ===== 5. 반응형 (반드시 마지막) ===== */
@media (max-width: 720px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .doc{padding:0 16px 160px}
  .menu-btn{display:inline-block;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;margin-top:14px}
  .doc-head{padding-top:12px}
  .f-graph{height:auto;display:flex;flex-direction:column;gap:12px;padding-left:14px;border-left:2px dashed var(--indigo)}
  .f-graph svg,.f-pt{display:none}
  .f-problem,.f-start,.f-end{position:static;transform:none;width:auto;text-align:left}
  .f-end{order:1}.f-problem{order:2}.f-chip{order:3}.f-start{order:4}
  .f-chip{position:static;transform:none;align-self:flex-start}
  .dump-act{flex-wrap:wrap;gap:8px}
  .dump-row .dump-x{padding:5px 6px}
  .coach-panel{right:0;bottom:0;left:0;width:auto;height:88vh;max-height:none;border-radius:14px 14px 0 0}
  .coach-mini{display:none}
  .coach-bubble{right:16px;bottom:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="me"><div><b id="meName"></b><br><span class="stage" id="meStage"></span></div></div>
    <h4>바운더리</h4>
    <div id="sideBoundary"></div>
    <button class="nav" id="newBoundary" disabled title="지금 바운더리가 끝나면 열려요">＋ 새 바운더리</button>
    <div id="sideDays"></div>
    <div class="foot"><a class="lec-btn" href="lecture-prototype.html" id="sideLecture">일의 프레임 강의 보러가기</a><small class="lec-sub" id="sideCourse"></small></div>
  </aside>
  <main class="doc">
    <div class="doc-in">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
      <header class="doc-head">
        <h1 id="bTitle" contenteditable="plaintext-only" aria-label="바운더리 이름 — 언제든 고칠 수 있어요" data-ph="바운더리 이름을 지어요 (예: 정체기 탈출 강의 완주 프로젝트)"></h1>
        <div class="props" id="props"></div>
      </header>
      <section class="formula" id="formula"></section>
      <div class="f-bar" id="fBar"><div class="f-summary" id="fSummary"></div></div>
      <section class="days" id="days"></section>
    </div>
  </main>
</div>
<button class="coach-bubble" id="coachBubble" aria-label="바운더리 코치">🦉<span class="dot" id="coachDot" hidden></span></button>
<div class="coach-mini" id="coachMini" hidden></div>
<div class="coach-panel" id="coachPanel" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<script id="app">
// ===== MOCK DATA =====
const Q = new URLSearchParams(location.search);
const STAGE_OVERRIDE = Q.get('stage') ? Number(Q.get('stage')) : null;
const USER = { name: '소정', stage: 2, course: 3 };
const SUGGEST = false; // 코치 업무 추천 카드 — 추천 근거 DB 확보 전까지 끔 (피드백 2026-09-13)
const KEY_QUESTION = '끝점(성과)에 가장 빠르게 도달할 수 있는 중요한 일 3가지인가요?';
const ITEM_PH = ['오늘 반드시 끝낼 일 하나 — 가장 먼저 해요', '그다음으로 중요한 일', '그다음으로 중요한 일'];
const REVIEW_Q = ['오늘의 바운더리는 끝점(성과)에 도달하는 일이었나요?', '만약 다시 한다면 다르게 일 할 것 같나요?'];

    $('dumpAdd').addEventListener('click', add);

    root.querySelectorAll('.dump-chk').forEach(c => c.addEventListener('change', () => {
      const i = Number(c.dataset.i);
      if (c.checked) { if (dumpSel.length >= MAX_PICK) { c.checked = false; toast('3개까지만 골라요. 나머지는 오늘 안 하는 일이에요.'); return; } dumpSel.push(i); }
      else dumpSel = dumpSel.filter(x => x !== i);
      renderDays();
    }));
    root.querySelectorAll('.dump-x').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i); dumpRemove(day, i);
      dumpSel = dumpSel.filter(x => x !== i).map(x => x > i ? x - 1 : x);
      persist(); renderDays();
    }));
    const pk = $('dumpPick');
    if (pk) pk.addEventListener('click', () => {
      const r = dumpPick(day, dumpSel);
      if (!r.ok) return;
      dumpSel = []; persist(); renderDays();
      onDumpPicked(r);
    });
  }
}
function openDay(d) { const el = document.querySelector(`.day[data-d="${d}"]`); if (el) el.classList.add('open'); }
function missLabel(p, cls) {
  const n = p.filled - p.done;
  return n > 0 ? `<small class="miss${cls ? ' ' + cls : ''}">미실행 ${n}건</small>` : '';
}
function renderSide() {
  const b = S.boundary;
  $('sideBoundary').innerHTML = `<button class="nav on">${esc(b.title || '이름 없는 바운더리')}<small>${b.from.slice(5).replace('-', '.')} ~ ${b.to.slice(5).replace('-', '.')} · ${daysLeft(b.to, TODAY)}일 남음</small></button>`;
  const dates = Object.keys(S.days).filter(d => d <= TODAY).sort().reverse();
  const label = d => d === TODAY ? '오늘' : (daysLeft(TODAY, d) === 1 ? '어제' : fmtDate(d).replace(/ .요일$/, ''));
  $('sideDays').innerHTML = `<h4>날짜</h4>` + dates.map(d => { const p = dayProgress(S.days[d]); return `<button class="nav sub" data-goto="${d}">${label(d)} ${d === TODAY ? `<small>${p.done}/3</small>` : missLabel(p)}</button>`; }).join('');
  $('sideDays').querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => {
    const el = document.querySelector(`.day[data-d="${b.dataset.goto}"]`);
    if (el) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }));
}
// ===== COACH =====
let coachOpen = false, coachTab = 'chat';
function buildCoachPanel() {
  const st = curStage();
  $('coachPanel').innerHTML = `
    <div class="cp-h"><span>🦉</span><div><b>바운더리 코치</b><small>${st.name} 단계 · ${st.point} 훈련 중</small></div><button class="x" id="coachClose" aria-label="닫기">✕</button></div>
    <div class="cp-tabs"><button id="tabChat" class="on">대화</button><button id="tabConcept">오늘의 개념</button></div>
    <div class="cp-body" id="chatLog"></div>
    <div class="cp-body" id="conceptBody" hidden></div>
    <div class="cp-in" id="chatBar"><input id="chatIn" placeholder="코치에게 물어봐요" maxlength="200"><button id="chatSend">보내기</button></div>`;
  $('coachClose').addEventListener('click', closeCoach);
  $('tabChat').addEventListener('click', () => setTab('chat'));
  $('tabConcept').addEventListener('click', () => setTab('concept'));
  const send = () => { const v = $('chatIn').value.trim(); if (!v) return; $('chatIn').value = ''; userSay(v); setTimeout(() => coachSay(freeReply(v)), 350); };
  $('chatSend').addEventListener('click', send);
  $('chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  renderConcept();
}
function setTab(t) {
  coachTab = t;
  $('tabChat').classList.toggle('on', t === 'chat'); $('tabConcept').classList.toggle('on', t === 'concept');
  $('chatLog').hidden = t !== 'chat'; $('conceptBody').hidden = t !== 'concept'; $('chatBar').hidden = t !== 'chat';
}
function renderConcept() {
  const st = curStage();
  $('conceptBody').innerHTML = `<div class="concept"><span class="k">${st.name} 단계의 학습 포인트</span><h4>${esc(st.tip.title)}</h4>${st.tip.quote.map(q => `<blockquote>${esc(q)}</blockquote>`).join('')}<div class="ask">내 일에 적용 — ${esc(st.tip.ask)}</div><button class="add" id="conceptAdd">이 질문을 오늘의 바운더리에 추가</button></div>`;
  $('conceptAdd').addEventListener('click', () => { onConceptAdd({ id: 'concept', text: st.tip.ask, why: `${st.name} 단계 학습 포인트` }); });
}
let onConceptAdd = () => {}; // Task 6
function scrollLog() { const l = $('chatLog'); l.scrollTop = l.scrollHeight; }
function coachSay(text, opts = {}) {
  const el = document.createElement('div'); el.className = 'msg c'; el.textContent = text; $('chatLog').appendChild(el); scrollLog();
  if (!coachOpen && !opts.silent) { $('coachDot').hidden = false; const m = $('coachMini'); m.textContent = text; m.hidden = false; clearTimeout(coachSay._t); coachSay._t = setTimeout(() => { m.hidden = true; }, 4000); }
  return el;
}
function userSay(text) { const el = document.createElement('div'); el.className = 'msg u'; el.textContent = text; $('chatLog').appendChild(el); scrollLog(); }
function openCoach(tab) { coachOpen = true; $('coachPanel').hidden = false; $('coachDot').hidden = true; $('coachMini').hidden = true; setTab(tab || 'chat'); scrollLog(); if (window.innerWidth <= 720) $('scrim').hidden = false; }
function closeCoach() { coachOpen = false; $('coachPanel').hidden = true; if (!$('side').classList.contains('open')) $('scrim').hidden = true; }
function coachGreet() {
  const mode = Q.get('time') || greeting(new Date().getHours());
  if (!canFire(S.coachSeen, TODAY, 'greet')) return;
  persist();
  const day = S.days[TODAY], p = dayProgress(day), st = curStage();
  if (mode === 'am') {
    const lr = lastReview(S, TODAY);
    coachSay(COACH.greetAm(S.user.name, lr ? lr.review : ''));
    setTimeout(() => conceptInChat(), 400);
    setTimeout(() => coachSay(COACH.keyQ1), 900);
    setTimeout(() => coachSay(COACH.keyQ2), 1300);
    if (p.filled === 0) setTimeout(() => coachSay(COACH.dumpPick, { silent: true }), 2200);
    if (SUGGEST) setTimeout(onGreetCards, 1200);
  } else {
    coachSay(COACH.greetPm(S.user.name, p.done, p.filled));
    setTimeout(() => coachSay(COACH.conceptToday(S.user.name, st.tip.title), { silent: true }), 600);
  }
}
function conceptInChat() {
  const st = curStage();
  const el = document.createElement('div'); el.className = 'card concept-card';
  el.innerHTML = `<div class="why">오늘의 개념 · ${esc(st.name)} 단계</div><b>${esc(st.tip.title)}</b>${st.tip.quote.map(q => `<div class="why">${esc(q)}</div>`).join('')}<div class="why ask">${esc(st.tip.ask)}</div><button class="add">이 질문을 오늘의 바운더리에 추가</button>`;
  $('chatLog').appendChild(el); scrollLog();
  el.querySelector('.add').addEventListener('click', () => onConceptAdd({ id: 'concept', text: st.tip.ask, why: `${st.name} 단계 학습 포인트` }));
}
let onGreetCards = () => {}; // Task 6
function coachCard(sug, opts = {}) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<b>${esc(sug.text)}</b><div class="why">${esc(sug.why)}</div>${opts.noAdd ? '<div class="why">내일 아침에 다시 물어볼게요.</div>' : '<button class="add">오늘의 바운더리에 추가</button>'}`;
  $('chatLog').appendChild(el); scrollLog();
  const btn = el.querySelector('.add');
  if (btn) btn.addEventListener('click', () => tryAdd(sug, el, btn));
  return el;
}
function tryAdd(sug, el, btn) {
  const day = S.days[TODAY];
  const wasDump = dayProgress(day).filled === 0;
  const r = addSuggestion(day, sug);
  if (r.ok) {
    let movedN = 0;
    if (wasDump) { movedN = day.dump.length; day.dropped = day.dropped.concat(day.dump); day.dump = []; dumpSel = []; }
    persist(); renderDays(); btn.textContent = '추가됨 ✓'; btn.disabled = true;
    coachSay(COACH.added(sug.text), { silent: true });
    if (movedN) coachSay(COACH.dumpDone(movedN), { silent: true });
    S.coachSeen[TODAY] = S.coachSeen[TODAY] || {}; if (!S.coachSeen[TODAY].items) S.coachSeen[TODAY].items = []; S.coachSeen[TODAY].items[r.index] = true; persist(); return;
  }
  if (el.querySelector('.swap')) return;
  coachSay(COACH.full, { silent: true });
  const sw = document.createElement('div'); sw.className = 'swap';
  sw.innerHTML = day.items.map((it, i) => `<button data-i="${i}">↔ ${esc(it.text)}</button>`).join('') + `<button class="keep">그냥 둘게요</button>`;
  el.appendChild(sw); scrollLog();
  sw.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => {
    const old = replaceItem(day, Number(b.dataset.i), sug); persist(); renderDays();
    sw.remove(); btn.textContent = '추가됨 ✓'; btn.disabled = true;
    coachSay(COACH.swapped(old.text), { silent: true });
  }));
  sw.querySelector('.keep').addEventListener('click', () => sw.remove());
}
onGreetCards = () => {
  if (!SUGGEST) return;
  const used = new Set(S.days[TODAY].items.map(it => it.text));
  SUGGESTIONS.filter(s => !used.has(s.text)).slice(0, 3).forEach((s, i) => setTimeout(() => coachCard(s), 300 * (i + 1)));
};
onConceptAdd = (sug) => { setTab('chat'); const el = coachCard(sug); tryAdd(sug, el, el.querySelector('.add')); };
function wireCoachReactions() {
  const st = () => curStage();
  onItemSaved = (i, item) => {
    if (!canFire(S.coachSeen, TODAY, 'items', i)) return; persist();
    const j = judgeSignal(item, S.boundary.formula);
    const f = S.boundary.formula;
    coachSay(j === 'signal' ? COACH.signal(f.numeric || f.customer || '끝점') : st().judge);
  };
  onFormulaSaved = (k, v) => {
    if (!v || !canFire(S.coachSeen, TODAY, 'formula_' + k)) return; persist();
    coachSay(COACH.formula[k]);
  };
  onOrderGuard = () => { if (!canFire(S.coachSeen, TODAY, 'guard')) return; persist(); coachSay(COACH.orderGuard); };
  onFormulaComplete = () => { if (!canFire(S.coachSeen, TODAY, 'complete')) return; persist(); coachSay(COACH.complete); };
  onDone3 = () => { if (!canFire(S.coachSeen, TODAY, 'done3')) return; persist(); coachSay(COACH.done3()); };
  onReviewSaved = () => {
    if (!canFire(S.coachSeen, TODAY, 'review')) return; persist();
    coachSay(COACH.afterReview);
    if (SUGGEST) {
      const used = new Set(S.days[TODAY].items.map(it => it.text));
      const next = SUGGESTIONS.find(s => !used.has(s.text)) || SUGGESTIONS[0];
      coachCard(next, { noAdd: true });
    }
  };
  onDumpOpen = () => { if (!canFire(S.coachSeen, TODAY, 'dumpOpen')) return; persist(); setTimeout(() => coachSay(COACH.dumpIntro, { silent: true }), 2300); };
  onDumpPicked = (r) => {
    if (!canFire(S.coachSeen, TODAY, 'dumpPicked')) return; persist();
    coachSay(COACH.dumpDone(r.dropped));
    setTimeout(() => coachSay(COACH.frogSplit, { silent: true }), 700);
    const day = S.days[TODAY];
    day.items.forEach((it, i) => { if (it.text) onItemSaved(i, it); });
  };
}
// ===== BOOT =====
let editingPeriod = false;
function shortDate(iso) { return iso.slice(5).replace('-', '.'); }
function renderHead() {
  const b = S.boundary, st = curStage();
  $('meName').textContent = S.user.name;
  $('meStage').textContent = `${st.name} · ${st.n}/6`;
  if (document.activeElement !== $('bTitle')) $('bTitle').textContent = b.title || '';
  $('sideCourse').textContent = `커리큘럼 ${S.user.course}/5 진행 중`;
  const period = editingPeriod
    ? `<span class="prop-edit"><input type="date" id="pFrom" value="${b.from}" aria-label="시작 날짜"><span class="prop-arrow">→</span><input type="date" id="pTo" value="${b.to}" aria-label="끝 날짜"><button class="prop-ok" id="pOk">확인</button><button class="prop-cancel" id="pCancel">취소</button></span>`
    : `<span class="prop-v prop-period" id="bPeriod" role="button" tabindex="0" aria-label="기간 고치기">${shortDate(b.from)} → ${shortDate(b.to)}</span>`;
  $('props').innerHTML = `
    <div class="prop"><span class="prop-k">기간</span>${period}</div>
    <div class="prop"><span class="prop-k">남은 일수</span><span class="prop-v">${daysLeft(b.to, TODAY)}일</span></div>
    <div class="prop"><span class="prop-k">단계</span><span class="prop-v">${esc(st.name)} ${st.n}/6</span></div>`;
  bindPeriod();
}
function bindPeriod() {
  const bp = $('bPeriod');
  if (bp) {
    const open = () => { editingPeriod = true; renderHead(); const f = $('pFrom'); if (f) f.focus(); };
    bp.addEventListener('click', open);
    bp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  }
  const ok = $('pOk');
  if (ok) ok.addEventListener('click', () => {
    const from = $('pFrom').value, to = $('pTo').value;
    if (!from || !to) { toast('시작과 끝 날짜를 모두 골라요.'); return; }
    if (to < from) { toast('끝 날짜가 시작보다 앞이에요.'); return; }
    S.boundary.from = from; S.boundary.to = to; editingPeriod = false;
    persist(); renderHead(); renderSide();
  });
  const cancel = $('pCancel');
  const cancelEdit = () => { editingPeriod = false; renderHead(); };
  if (cancel) cancel.addEventListener('click', cancelEdit);
  ['pFrom', 'pTo'].forEach(id => { const inp = $(id); if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); } }); });
}
function bindTitle() {
  const el = $('bTitle');
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); el.textContent = S.boundary.title || ''; el.blur(); }
  });
  // 전부 지우면 contenteditable이 <br>을 남겨 :empty 플레이스홀더가 안 뜬다 → 비운다
  el.addEventListener('input', () => { if (!el.textContent.trim()) el.textContent = ''; });
  el.addEventListener('blur', () => {
    const v = el.textContent.trim();
    el.textContent = v; // 남은 <br>·공백 제거해 :empty 성립
    if (v === (S.boundary.title || '')) return;
    S.boundary.title = v; persist(); renderSide();
  });
}
function boot() {
  if (Q.get('reset') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }
  S = loadState(localStorage);
  TODAY = todayStr();
  ensureDay(S, TODAY);
  renderHead();
  bindTitle();
  renderFormula();
  wireCoachReactions();
  buildCoachPanel();
  renderDays();
  $('coachBubble').addEventListener('click', () => coachOpen ? closeCoach() : openCoach('chat'));
  $('menuBtn').addEventListener('click', () => { $('side').classList.toggle('open'); $('scrim').hidden = !$('side').classList.contains('open'); });
  $('scrim').addEventListener('click', () => { $('side').classList.remove('open'); closeCoach(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCoach(); });
  document.addEventListener('click', e => { if (coachOpen && !$('coachPanel').contains(e.target) && !$('coachBubble').contains(e.target) && !document.querySelector('.doc').contains(e.target)) closeCoach(); });
  $('meStage').addEventListener('click', () => setTimeout(() => openCoach('concept'), 0));
  setTimeout(coachGreet, 500);
  watchCollapse();
}
boot();
</script>
