<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F2ED">
<title>withWITH — 앱 첫 화면 (모바일)</title>
<style>
/* ===== 1. 토큰 — 마이스페이스 코치 챗(ChatGPT 규격)과 같은 언어 ===== */
:root{
  --brand-bg:#F5F2ED; --brand-ink:#2B2B2B;            /* withWITH 로고 */
  --paper:#FFFFFF; --ink:#0D0D0D; --sub:#5D5D5D; --faint:#8F8F8F; --line:#E5E5E5; --fill:#F4F4F4; --fill2:#FAFAFA;
  --accent:#5B5BD6; --accent-ink:#3F3FB0; --accent-soft:#EEF0FF;   /* 일의 공식 그래프·2:8에만 */
  --warn:#C8323A; --warn-soft:#FDECEC; --outside:#EDEDED;
  --ring:0 4px 4px rgba(0,0,0,.04),0 0 1px rgba(0,0,0,.62); --inring:inset 0 0 0 1px rgba(0,0,0,.12);
  --shadow:0 8px 24px rgba(0,0,0,.10);
  --av:#E4EBE0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--outside);color:var(--ink);font-family:ui-sans-serif,-apple-system,system-ui,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;-webkit-font-smoothing:antialiased;word-break:keep-all;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:0}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.phone{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14px;line-height:20px;padding:10px 16px;border-radius:999px;z-index:90;box-shadow:var(--shadow);white-space:nowrap}

/* ===== 2. 공통 — 머리말 · 버튼 · 입력 상자 ===== */
.hd{flex:none;height:52px;display:grid;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);align-items:center;gap:8px;padding:0 6px}
.hd .t{text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .r{justify-self:end;margin-right:10px;font-size:13px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;border:0;background:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{background:var(--fill)}
.ib svg{width:20px;height:20px}
.body{flex:1;overflow:auto;padding:4px 20px 24px}
.foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 16px calc(12px + var(--sab))}
.pill{height:48px;border-radius:999px;border:0;padding:0 20px;font-size:16px;font-weight:500;background:var(--paper);color:var(--ink);box-shadow:var(--inring)}
.pill:hover{background:var(--fill2)}
.pill.primary{background:var(--ink);color:var(--paper);box-shadow:none}
.pill.primary:hover{background:var(--ink);opacity:.88}
.pill:disabled,.pill.primary:disabled{background:var(--fill);color:var(--faint);box-shadow:none;opacity:1;cursor:default}
.pill.sm{height:36px;padding:0 14px;font-size:14px}
.pill.w{width:100%}
.row2{display:flex;gap:8px}
.row2 .pill{flex:1}
.cbox{border-radius:28px;background:var(--paper);box-shadow:var(--ring);padding:10px;display:flex;flex-direction:column}
.cbox textarea{width:100%;border:0;outline:0;resize:none;background:none;font-size:16px;line-height:24px;min-height:24px;max-height:120px;margin:6px 0 10px;padding:0 10px;cursor:text}
.cbox textarea::placeholder{color:var(--faint)}
.cbar{display:flex;align-items:center;gap:6px;min-height:36px}
.cbar .cnt{margin-left:10px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tool{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:0;background:none;font-size:14px;box-shadow:var(--inring)}
.tool svg{width:18px;height:18px}
.send{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.send:disabled{background:var(--line);cursor:default}
.send svg{width:20px;height:20px}
.cfoot{min-height:28px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:6px 0 0;font-size:12px;line-height:16px;color:var(--sub);text-align:center}
.cfoot button{border:0;background:none;padding:0;font-size:12px;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--av);overflow:hidden}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.av.lg{width:44px;height:44px}
.h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.lead{margin:4px 0 0;font-size:15px;line-height:24px;color:var(--sub)}

/* ===== 3. 스플래시 ===== */
.splash{background:var(--brand-bg);align-items:center;justify-content:center;cursor:pointer;transition:opacity .45s ease}
.splash.out{opacity:0}
.splash img{width:58%;max-width:220px;height:auto;display:block}
.splash .tag{margin-top:16px;font-size:14px;color:var(--brand-ink);opacity:.65}

/* ===== 4. 질문 — ChatGPT 새 대화 화면처럼 ===== */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 6vh}
.hero .av{margin-bottom:18px}
.hero .pre{margin:0 0 4px;font-size:16px;line-height:24px;color:var(--faint)}
.hero h1{margin:0;font-size:28px;line-height:36px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.hero .sub{margin:12px 0 0;font-size:15px;line-height:24px;color:var(--sub);text-wrap:balance}
.q-in{animation:qIn .3s ease}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.composer{flex:none;padding:0 12px calc(8px + var(--sab))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 10px;scrollbar-width:none}
.chip{flex:none;max-width:100%;border:0;background:var(--paper);box-shadow:var(--inring);border-radius:16px;padding:8px 14px;font-size:14px;line-height:20px;text-align:left;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--fill2)}
.chip .k{color:var(--faint);margin-right:6px}

/* ===== 5. 일의 공식 그래프 ===== */
.fcard{background:var(--fill2);border-radius:20px;padding:16px 18px 18px}
.fg .prob{text-align:center}
.fg .lab{display:block;font-size:12px;line-height:16px;color:var(--faint)}
.fg .prob b{display:block;margin-top:4px;font-size:15px;line-height:22px;font-weight:600}
.fg svg{display:block;width:100%;height:56px;margin-top:8px;overflow:visible}
.fg .arc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 6}
.fg .base{stroke:var(--line);stroke-width:1.5}
.fg .pt{fill:var(--accent)}
.fg .ends{display:flex;justify-content:space-between;margin-top:2px;font-size:12px;line-height:16px;color:var(--faint)}
.fg .end{margin-top:8px;text-align:right}
.fg .end b{display:block;font-size:15px;line-height:22px;font-weight:600}
.fg .end q{display:block;font-size:15px;line-height:22px;font-weight:500;color:var(--sub);quotes:'“' '”'}
.fg.draw svg{animation:arcDraw 1.1s ease forwards}
@keyframes arcDraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.fg.draw .end{opacity:0;animation:fadeIn .4s ease .9s forwards}
@keyframes fadeIn{to{opacity:1}}
.made .hero{flex:none;padding:28px 4px 24px}

/* ===== 6. 오늘의 바운더리 — 직접 적기 ===== */
.sec{margin-top:24px}
.items{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:8px}
.row .n{flex:none;width:22px;font-size:14px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.row input{flex:1;min-width:0;height:48px;border:0;border-radius:14px;padding:0 14px;font-size:16px;background:var(--fill);outline:0;cursor:text}
.row input:focus{background:var(--paper);box-shadow:var(--ring)}
.row input::placeholder{color:var(--faint)}
.seg{flex:none;display:inline-flex;background:var(--fill);border-radius:999px;padding:3px}
.seg button{min-width:38px;height:34px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--sub);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg .x[aria-pressed="true"]{color:var(--warn)}
.row.x input{background:var(--warn-soft)}
.xnote{margin:-2px 0 0 30px;font-size:13px;line-height:20px;color:var(--warn)}
.hint{margin:14px 0 0;font-size:13px;line-height:20px;color:var(--faint)}
.ask-q{margin:0;font-size:14px;line-height:20px;color:var(--sub)}
.ask-q b{color:var(--ink);font-weight:600}

/* ===== 7. 2:8 점검 ===== */
.why{margin:10px 0 0;padding:12px 14px;background:var(--fill2);border-radius:14px;font-size:14px;line-height:22px;color:var(--sub)}
.srows{display:flex;flex-direction:column;margin-top:14px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0;padding-bottom:4px}
.srow .tx{flex:1;min-width:0;font-size:16px;line-height:24px}
.seg .to{min-width:52px}
.seg .to[data-k="28"][aria-pressed="true"]{color:var(--accent-ink)}
.legend{display:grid;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.legend p{margin:0;display:flex;gap:10px;font-size:14px;line-height:22px;color:var(--sub)}
.legend b{flex:none;width:36px;font-weight:600;color:var(--ink)}
.legend .a b{color:var(--accent-ink)}

/* ===== 8. 잠금화면 — 앱과 같은 톤: 로고 바탕 · 검정 글자 · 인디고 아치 ===== */
.lock{background:var(--brand-bg);color:var(--ink)}
.lock .ls{flex:1;overflow:auto;padding:40px 28px 20px;display:flex;flex-direction:column}
.lock .clock{text-align:center;font-size:80px;line-height:1;font-weight:300;letter-spacing:-.02em;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.lock .ldate{margin:10px 0 32px;text-align:center;font-size:17px;line-height:24px;color:var(--sub)}
.lock .fcard{background:rgba(255,255,255,.6)}
.lock .lb{margin:28px 0 10px;font-size:13px;line-height:16px;color:var(--faint)}
.lock .main{margin:0 0 10px;font-size:22px;line-height:30px;font-weight:600;color:var(--brand-ink)}
.lock .minor{margin:4px 0 0;font-size:15px;line-height:22px;color:var(--sub)}
.lock .brand{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lock .brand img{width:88px;height:auto;opacity:.8}
.lock .brand span{font-size:12px;line-height:16px;color:var(--faint)}
.lock .foot{background:var(--paper)}

/* ===== 9. 대시보드 · 스탬프 ===== */
.group{margin-top:22px}
.glab{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:20px;color:var(--faint)}
.glab b{font-size:14px;font-weight:600;color:var(--ink)}
.glab.a b{color:var(--accent-ink)}
.todo{display:flex;flex-direction:column;margin-top:4px}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.todo .chk:last-child{border-bottom:0}
.chk .box{flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--paper)}
.chk .box svg{width:12px;height:12px;opacity:0}
.chk.on .box{background:var(--ink);box-shadow:none}
.chk.on .box svg{opacity:1}
.chk .tx{font-size:16px;line-height:28px}
.chk.on .tx{color:var(--faint);text-decoration:line-through}
.chk .sb{display:block;font-size:13px;line-height:20px;color:var(--faint);text-decoration:none}
.mantra{margin:18px 0 0;font-size:14px;line-height:22px;color:var(--sub)}
.mantra b{color:var(--ink);font-weight:600}
.stamps{margin-top:28px;padding:16px;background:var(--fill2);border-radius:20px}
.stamps .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stamps .top b{font-size:15px;font-weight:600}
.stamps .top span{font-size:13px;color:var(--faint)}
.srow2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.stp{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.stp.on{background:var(--accent);color:var(--paper);box-shadow:none}
.confirm-q{margin:0 0 10px;font-size:15px;line-height:24px}
.stamp-scr .hero{padding-bottom:10vh}
.big-stamp{width:120px;height:120px;border-radius:50%;background:var(--accent);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:28px;animation:stampIn .45s cubic-bezier(.2,1.5,.4,1)}
.big-stamp b{font-size:40px;line-height:1;font-weight:600}
.big-stamp span{margin-top:6px;font-size:11px;letter-spacing:.14em}
@keyframes stampIn{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.got{margin-top:22px;width:100%;text-align:left;padding:14px 16px;background:var(--fill2);border-radius:16px;font-size:14px;line-height:22px;color:var(--sub)}
.got b{color:var(--ink);font-weight:600}

/* ===== 9b. 일의 공식 카드 머리 · 성과 달성 · 어제 점검 · 확인 시트 ===== */
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px -4px 10px 0}
.fhead span{font-size:13px;line-height:20px;font-weight:600;color:var(--sub)}
.fhead .pill{height:32px;padding:0 12px;font-size:13px;background:var(--paper)}
.rv-list{display:flex;flex-direction:column;margin-top:14px}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rv-row:last-child{border-bottom:0}
.rv-row .tx{flex:1;min-width:0;font-size:16px;line-height:24px}
.rv-row .tag{display:inline-block;margin-right:6px;font-size:12px;font-weight:600;color:var(--faint)}
.rv-row .tag.a{color:var(--accent-ink)}
.seg .dn{min-width:64px}
.seg .dn[data-v="0"][aria-pressed="true"]{color:var(--warn)}
.rv-sum{margin:16px 0 0;font-size:15px;line-height:24px;color:var(--sub)}
.rv-sum b{color:var(--ink);font-weight:600}
.sheet{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;animation:fadeIn .2s ease forwards}
.sheet .panel{width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px calc(18px + var(--sab));animation:up .25s ease}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0;font-size:20px;line-height:28px;font-weight:600}
.sheet p{margin:6px 0 18px;font-size:15px;line-height:24px;color:var(--sub)}
.sheet p b{color:var(--ink);font-weight:600}
.sheet .row2{flex-direction:column}
.sheet .row2 .pill{flex:none;width:100%}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}

/* ===== 10. 채팅 ===== */
.thread{flex:1;overflow:auto;padding:0 16px 24px}
.sys{display:flex;justify-content:center;font-size:12px;line-height:16px;color:var(--faint);padding:8px 0 0}
.sys i{font-style:normal;background:var(--fill);border-radius:999px;padding:3px 10px}
.turn{display:flex;padding:18px 0}
.turn.u{justify-content:flex-end}
.bubble{max-width:70%;background:var(--fill);border-radius:24px;padding:10px 20px;overflow-wrap:anywhere}
.turn.n{gap:12px;align-items:flex-start}
.md{min-width:0;flex:1;overflow-wrap:anywhere}
.md p{margin:0 0 16px}
.md p:last-child{margin-bottom:0}
.md b{font-weight:600}
.md ol{margin:0 0 16px;padding-left:26px}
.md li{margin:8px 0;padding-left:6px}
.md li .sb{display:block;font-size:14px;line-height:24px;color:var(--sub)}
.md .meta{font-size:14px;line-height:24px;color:var(--sub)}
.md .meta b{color:var(--ink)}
.typing{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink);margin:8px 0;animation:pulse 1.25s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
.acts{display:flex;gap:8px;margin:-6px 0 0 40px;padding-bottom:32px}
.acts.flush{margin-left:0;padding-top:18px}
.sug{width:100%;text-align:left;border:0;background:var(--paper);box-shadow:var(--inring);border-radius:16px;padding:10px 16px;margin:0 0 8px;font-size:14px;line-height:20px;cursor:pointer}
.sug .lab{display:block;font-size:12px;line-height:16px;color:var(--faint);margin-bottom:2px}
.sug .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chat .composer{padding-top:12px}
.fsheet{margin-top:6px}

@media (prefers-reduced-motion: reduce){.q-in,.typing,.fg.draw svg,.fg.draw .end,.big-stamp{animation:none;opacity:1}.splash{transition:none}}

/* ===== 11. PC — 폰 테두리만 (반드시 마지막) ===== */
@media (min-width: 600px){
  .phone{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:28px;box-shadow:var(--shadow)}
}
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script id="app">
// ===== MOCK =====
const Q = new URLSearchParams(location.search);
const KEY = 'trus_withwith_app';
const V = 1;

function todayStr() {
  const p = Q.get('today');
  if (typeof p === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(p)) return p;
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function blankToday(date) { return { date, items: [0, 1, 2].map(() => ({ text: '', ox: null, done: false, kind: null })), extra: [], confirmed: false, split: false, via: '', mantra: '', avoid: '' }; }
function defaultState() { return { v: V, name: '', formula: { numeric: '', customer: '', problem: '' }, today: blankToday(todayStr()), rejected: [], stamps: [], history: [] }; }
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.v === V) { if (!Array.isArray(s.history)) s.history = []; rollDay(s, todayStr()); return s; }
  } catch (e) { /* 무시 */ }
  return defaultState();
}
// 날이 바뀌면 어제 정한 바운더리를 기록으로 넘기고, 아침에 '했는지' 점검하게 한다
function rollDay(s, today) {
  if (s.today && s.today.date === today) return s;
  if (s.today && s.today.confirmed) s.history.unshift({ date: s.today.date, items: s.today.items.map(it => ({ text: it.text, kind: it.kind, done: it.done ? true : null })), reviewed: false });
  s.today = blankToday(today); return s;
}
function pendingReview(s) { const h = s.history && s.history[0]; return h && !h.reviewed ? h : null; }
function formulaDone(s) { return !!(s.name && s.formula.numeric && s.formula.customer && s.formula.problem); }
function allFilled(t) { return t.items.every(it => it.text.trim()); }
function oCount(t) { return t.items.filter(it => it.ox === 'O').length; }
function splitCount(t) { return t.items.filter(it => it.kind).length; }
function ofKind(t, k) { return [...t.items.filter(it => it.kind === k), ...t.extra.filter(it => it.kind === k)]; }
function startScreen(s) { return !formulaDone(s) ? 'q' : pendingReview(s) ? 'review' : s.today.split ? 'dash' : s.today.confirmed ? 'split' : 'today'; }
function fmtDate(iso) { const d = new Date(iso + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; }

// 배경으로 저장 — 1179×2556(아이폰 화면) PNG를 캔버스로 그린다. 외부 라이브러리 없이
// 한국어도 띄어쓰기 단위로 줄바꿈(keep-all). 한 단어가 폭보다 길 때만 글자 단위로 자른다

function drawLock() {

  // 시계·날짜는 폰이 그 위에 그리므로 이미지에는 넣지 않는다 — 폰 시계 영역(위 약 30%) 아래부터 그린다

  font(600, 46); x.fillStyle = ink; wrap(x, `“${f.problem}”`, cw - 120).forEach((l, i) => x.fillText(l, W / 2, cy + 180 + i * 62));

  let yy = y0 + 150; font(600, 44); x.fillStyle = ink; wrap(x, f.numeric, cw - 140).forEach(l => { x.fillText(l, R + 16, yy); yy += 60; });
  font(500, 42); x.fillStyle = sub; wrap(x, `“${f.customer}”`, cw - 140).forEach(l => { x.fillText(l, R + 16, yy); yy += 58; });
  x.textAlign = 'left'; yy = cy + ch + 150; font(500, 36); x.fillStyle = faint; x.fillText('오늘의 바운더리', 110, yy); yy += 96;
  font(600, 62); x.fillStyle = ink; ofKind(t, '28').forEach(it => { wrap(x, it.text, W - 220).forEach(l => { x.fillText(l, 110, yy); yy += 84; }); yy += 20; });

  return `<section class="scr chat">${head}<div class="thread" id="thread"><div class="sys"><i>${esc(fmtDate(S.today.date))} · 아침</i></div>${chat.log.map(msgHTML).join('')}${res ? resultHTML() : ''}${typing}</div>
    <div class="composer">${mine ? `<button class="sug" id="cSug"><span class="lab">예시 답 — 누르면 이대로 보내요</span><span class="tx">${esc(nameIn(tn.text))}</span></button>` : ''}<div class="cbox"><textarea id="cIn" rows="1" placeholder="${res ? '위에서 저장하거나 다시 정해요' : mine ? '코치에게 답해요' : '코치가 쓰는 중이에요…'}" aria-label="내 답"${mine ? '' : ' disabled'}></textarea><div class="cbar"><button class="tool" id="cFormula">${IC.doc}나의 일의 공식</button><button class="send" id="cSend" aria-label="보내기"${mine ? '' : ' disabled'}>${IC.up}</button></div></div>
    <div class="cfoot">준비된 예시 대화예요. 어떤 답을 보내도 같은 대화가 이어져요.${res ? '' : ' <button id="cSkip">결과로 건너뛰기</button>'}</div></div></section>`;
}
function chatStart() { chat = { variant: 'A', idx: 0, log: [], wait: null, timer: null, view: 'chat' }; show('chat'); chatStep(); }
function chatStep() {
  clearTimeout(chat.timer);
  const tn = chatScript().turns[chat.idx];
  if (!tn) { chat.wait = null; chat.view = 'result'; render(); return; }
  if (tn.who === 'u') { chat.wait = 'u'; render(); const s = $('cSug'); if (s) s.focus(); return; }
  chat.wait = 'n'; render();
  chat.timer = setTimeout(() => { chat.log.push(tn); chat.idx++; chatStep(); }, FAST ? 0 : Math.min(1400, 450 + tn.text.length * 9));
}
function chatSend(text) {
  const tn = chatScript().turns[chat.idx];
  if (chat.wait !== 'u' || !tn) return;
  chat.log.push({ who: 'u', text: (text || '').trim() || tn.text }); chat.idx++; chatStep();
}
function chatSkip() { clearTimeout(chat.timer); const ts = chatScript().turns; while (chat.idx < ts.length) { chat.log.push(ts[chat.idx]); chat.idx++; } chatStep(); }
function chatRetry() {
  S.rejected.push({ date: S.today.date, variant: chat.variant, items: chatScript().result.items.map(it => nameIn(it.text)) }); persist();
  const ks = Object.keys(NPA_SCRIPTS); chat.variant = ks[(ks.indexOf(chat.variant) + 1) % ks.length]; chat.idx = 0; chat.view = 'chat';
  chat.log.push({ who: 'sys', text: '다시 정하기 — 앞의 3개는 기록해 두고, 다른 각도로 다시 물을게요' });
  chatStep();
}
function chatSave() {
  const r = chatScript().result;
  S.today.items = r.items.map(it => ({ text: nameIn(it.text).slice(0, 80), ox: 'O', done: false, kind: null, sub: it.done ? nameIn(it.done) : '' }));
  S.today.extra = []; S.today.confirmed = true; S.today.split = false; S.today.via = 'chat'; S.today.mantra = nameIn(r.mantra); S.today.avoid = nameIn(r.avoid);
  persist(); clearTimeout(chat.timer); chat = null; show('split'); toast('3개를 정했어요. 이제 2:8로 나눠요.');
}
// --- 바인딩 ---
function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  if (scr === 'splash') { on('splash', afterSplash); return; }
  on('achieve', () => { achAsk = true; render(); const y = $('achYes'); if (y) y.focus(); });
  on('achNo', () => { achAsk = false; render(); const a = $('achieve'); if (a) a.focus(); });
  on('achYes', () => { S.stamps.push({ date: S.today.date, ...S.formula }); S.formula = { numeric: '', customer: '', problem: '' }; S.today = blankToday(todayStr()); S.history.forEach(h => { h.reviewed = true; }); achAsk = false; persist(); show('stamp'); });
  const sh = $('sheet'); if (sh) sh.addEventListener('click', e => { if (e.target === sh) { achAsk = false; render(); } });
  if (scr === 'review') {
    document.querySelectorAll('.dn').forEach(b => b.addEventListener('click', () => { const it = pendingReview(S).items[+b.dataset.i], v = b.dataset.v === '1'; it.done = it.done === v ? null : v; persist(); render(); }));
    on('rvDone', () => { const h = pendingReview(S); if (!h || h.items.some(it => it.done === null)) return; h.reviewed = true; persist(); show('today'); });
  }
  if (scr === 'q') {
    const inp = $('qIn'), q = QUESTIONS[qi];
    const sync = () => { $('qGo').disabled = !inp.value.trim(); $('qCnt').textContent = `${inp.value.length}/${q.max}`; inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; };
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\n/g, ''); sync(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); qSubmit(); } });
    $('qForm').addEventListener('submit', e => { e.preventDefault(); qSubmit(); });
    on('qEx', () => { inp.value = q.ex; sync(); inp.focus(); });
    on('qBack', () => { if (qi > 0) { qi--; render(); focusIn(); } });
    sync();
  }
  on('madeBack', () => { qi = QUESTIONS.length - 1; show('q'); focusIn(); });
  on('toToday', () => show('today'));
  if (scr === 'today') {
    document.querySelectorAll('.row input').forEach(el => el.addEventListener('input', () => {
      const it = S.today.items[+el.dataset.i], was = allFilled(S.today), had = it.ox;
      it.text = el.value; it.ox = null; persist();
      if (was !== allFilled(S.today) || had) { const pos = el.selectionStart; render(); const again = document.querySelector(`.row input[data-i="${el.dataset.i}"]`); again.focus(); again.setSelectionRange(pos, pos); }
      else syncToday();
    }));
    document.querySelectorAll('.ox').forEach(b => b.addEventListener('click', () => { const it = S.today.items[+b.dataset.i]; it.ox = it.ox === b.dataset.v ? null : b.dataset.v; persist(); render(); }));
    on('confirm', () => { if (oCount(S.today) !== 3) return; S.today.confirmed = true; S.today.split = false; S.today.via = 'self'; S.today.items.forEach(it => { it.kind = null; }); S.today.extra = []; persist(); show('split'); toast('3개를 확정했어요. 이제 2:8로 나눠요.'); });
    on('toChat', chatStart);
  }
  if (scr === 'split') {
    document.querySelectorAll('.to').forEach(b => b.addEventListener('click', () => { const it = S.today.items[+b.dataset.i]; it.kind = it.kind === b.dataset.k ? null : b.dataset.k; persist(); render(); }));
    on('splitBack', () => { S.today.confirmed = false; S.today.items.forEach(it => { it.kind = null; it.ox = null; }); S.today.extra = []; persist(); show('today'); });
    on('toLock', () => { if (splitCount(S.today) !== 3) return; S.today.split = true; persist(); show('lock'); });
  }
  if (scr === 'lock') {
    on('toDash', () => show('dash'));
    on('saveBg', saveBg);
    clearInterval(bind._clock); bind._clock = setInterval(() => { const c = $('clock'); if (c) c.textContent = hhmm(); else clearInterval(bind._clock); }, 15000);
  }
  if (scr === 'dash') {
    document.querySelectorAll('.chk').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i, e = +b.dataset.e, it = i >= 0 ? S.today.items[i] : S.today.extra[e]; it.done = !it.done; persist(); render(); }));
    on('toLock2', () => show('lock'));
    on('dashRedo', () => { S.today.split = false; persist(); show('split'); });
  }
  on('nextFormula', () => { qi = 1; show('q'); focusIn(); });
  if (scr === 'chat') {
    on('cBack', () => { if (chat.view === 'formula') { chat.view = chat.back; chatStep(); return; } clearTimeout(chat.timer); chat = null; show('today'); });
    on('cFormula', () => { clearTimeout(chat.timer); chat.back = chat.view; chat.view = 'formula'; render(); });
    on('cFBack', () => { chat.view = chat.back; if (chat.view === 'result') render(); else chatStep(); });
    on('cSug', () => chatSend(chatScript().turns[chat.idx].text));
    on('cSend', () => chatSend($('cIn').value));
    on('cSkip', chatSkip); on('cRetry', chatRetry); on('cSave', chatSave);
    const ci = $('cIn');
    if (ci) {
      ci.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); chatSend(ci.value); } });
      ci.addEventListener('input', () => { ci.style.height = 'auto'; ci.style.height = Math.min(160, ci.scrollHeight) + 'px'; });
    }
    const th = $('thread'); if (th && chat.view !== 'formula') th.scrollTop = th.scrollHeight;
  }
}
function syncToday() { const n = oCount(S.today), c = $('confirm'); if (c) c.disabled = n !== 3; }

// ===== BOOT =====
function afterSplash() {
  if (scr !== 'splash') return;
  const sp = $('splash'); sp.classList.add('out');
  setTimeout(() => {
    const st = startScreen(S);
    if (st === 'q') { qi = S.name ? 1 : 0; show('q'); focusIn(); } else show(st); // 일의 공식이 있으면 매일 '오늘의 바운더리 정하기'부터
  }, FAST ? 0 : 420);
}
function boot() {
  if (Q.get('reset') === '1') { try { localStorage.removeItem(KEY); } catch (e) { /* 무시 */ } }
  S = loadState(); persist();
  render();
  setTimeout(afterSplash, FAST ? 0 : SPLASH_MS);
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (achAsk) { achAsk = false; render(); } else if (scr === 'chat' && chat) { clearTimeout(chat.timer); chat = null; show('today'); } });
}
boot();
</script>
</body>
