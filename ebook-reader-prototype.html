<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이북 리더기 — 생각구독</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#FFFFFF; --ink:#121212; --sub:#666666; --line:#E5E5E5;
  --blue:#00B8FF; --blue-d:#067CAF; --blue-dd:#045D84; --blue-soft:#E5F7FF; --cream:#FAFBED;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--paper); color:var(--ink); letter-spacing:-0.01em; word-break:keep-all;
  display:flex; flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.serif{letter-spacing:-0.02em}
:focus-visible{outline:3px solid #3182F6; outline-offset:2px}

/* 진행 바 */
.progress{position:fixed; top:0; left:0; right:0; height:3px; background:var(--line); z-index:70}
.progress b{display:block; height:100%; background:var(--blue); width:0; transition:width .25s}

/* 상단바 */
.bar{display:flex; align-items:center; gap:10px; padding:13px 18px; background:#fff;
  border-bottom:1px solid var(--line); flex-shrink:0; margin-top:3px}
.back{font-size:.88rem; font-weight:700; color:var(--sub); padding:8px 10px; border-radius:9px; white-space:nowrap}
.back:hover{background:#F0F0F0; color:var(--ink)}
.bar .book{display:flex; align-items:center; gap:10px; margin:0 auto; min-width:0}
.bar .bt{font-size:.98rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .tag{font-size:.7rem; font-weight:800; padding:4px 10px; border-radius:7px; background:var(--blue-soft);
  color:var(--blue-dd); flex-shrink:0}
.tool{font-size:.84rem; font-weight:700; color:var(--sub); padding:8px 11px; border-radius:9px; white-space:nowrap}
.tool:hover{background:#F0F0F0; color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--blue-soft); color:var(--blue-dd)}

/* 목차 패널 */
.toc{position:fixed; z-index:60; top:0; bottom:0; left:0; width:290px; background:#FAFAFA;
  border-right:1px solid var(--line); transform:translateX(-100%); transition:transform .22s;
  overflow-y:auto; padding-bottom:30px; box-shadow:12px 0 30px rgba(0,0,0,0)}
.toc.open{transform:none; box-shadow:12px 0 30px rgba(0,0,0,.08)}
.toc .th{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px}
.toc .th h2{font-size:1.05rem; font-weight:900}
.toc .th button{color:var(--sub); font-size:.95rem; padding:6px 9px; border-radius:8px}
.toc .th button:hover{background:#F0F0F0}
.toc .sub{padding:0 20px 14px; font-size:.78rem; color:var(--sub)}
.toc-i{display:flex; align-items:baseline; gap:9px; width:100%; text-align:left; padding:13px 20px;
  font-size:.9rem; border-left:3px solid transparent}
.toc-i:hover{background:#F0F0F0}
.toc-i.on{background:#fff; border-left-color:var(--blue-d); font-weight:700}
.toc-i .no{font-size:.7rem; color:var(--blue-d); font-weight:700; flex-shrink:0}

/* 본문 */
.read{flex:1; overflow-y:auto; padding:44px 24px 30px}
.page{max-width:680px; margin:0 auto}
.page .bk{font-size:.78rem; font-weight:700; color:var(--blue-d); margin-bottom:10px}
.page h1{font-size:1.65rem; font-weight:900; margin-bottom:26px; line-height:1.4}
.prose{line-height:1.95; color:#212121}
.prose p{margin-bottom:1.25em}
body[data-fs="0"] .prose{font-size:.92rem}
body[data-fs="1"] .prose{font-size:1.02rem}
body[data-fs="2"] .prose{font-size:1.14rem}

/* 하단 내비 */
.nav{flex-shrink:0; border-top:1px solid var(--line); background:#fff; padding:13px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px}
.nav button{font-size:.88rem; font-weight:700; padding:10px 15px; border-radius:10px; border:1.5px solid var(--line)}
.nav button:hover:not(:disabled){border-color:var(--ink)}
.nav button:disabled{opacity:.32; cursor:not-allowed}
.nav .pos{font-size:.82rem; color:var(--sub); font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
/* 모바일 (기본 규칙 뒤!) */
@media (max-width:560px){
  .bar .bt{display:none}
  .read{padding:30px 18px 24px}
}
</style>
</head>
<body data-fs="1">

<div class="progress" aria-hidden="true"><b id="pbar"></b></div>

<header class="bar">
  <a class="back" href="subscribe-prototype.html">← 윤소정의 생각구독</a>
  <div class="book">
    <span class="bt serif">경계 세우는 연습</span>
    <span class="tag">구독자 모드</span>
  </div>
  <button class="tool" id="tocBtn" aria-pressed="false" onclick="toggleToc()">☰ 목차</button>
  <button class="tool" onclick="fontSize(-1)" aria-label="글자 작게">Aa−</button>
  <button class="tool" onclick="fontSize(1)" aria-label="글자 크게">Aa＋</button>
</header>

<nav class="toc" id="toc" aria-label="목차">
  <div class="th"><h2 class="serif">경계 세우는 연습</h2><button onclick="toggleToc()" aria-label="목차 닫기">✕</button></div>
  <p class="sub">일과 관계에서 나를 지키는 법</p>
  <div id="tocList"></div>
</nav>

<main class="read" id="read">
  <article class="page">
    <p class="bk" id="pageNo"></p>
    <h1 class="serif" id="pageTitle"></h1>
    <div class="prose" id="pageBody"></div>
  </article>
</main>

<footer class="nav">
  <button id="prevBtn" onclick="move(-1)">← 이전 글</button>
  <span class="pos" id="pos" role="status" aria-live="polite"></span>
  <button id="nextBtn" onclick="move(1)">다음 글 →</button>
</footer>

<script>
// ── 목데이터 (편집기와 동일한 BOOK — 두 파일에 복붙 공유)
const BOOK = {
  title: '경계 세우는 연습',
  subtitle: '일과 관계에서 나를 지키는 법',
  chapters: [
    { title: '1. 거절에도 예의가 있다',
      body: [
        '거절을 미루는 것은 배려가 아니라 유예다. 대답을 미루는 동안 상대는 계획을 세우지 못하고, 나는 마음의 빚을 키운다. 상대의 시간을 아끼는 가장 정중한 방법은, 빠르고 분명하게 말하는 것이다.',
        '분명한 거절에는 세 가지가 담긴다. 요청을 이해했다는 확인, 들어줄 수 없다는 결론, 그리고 가능하다면 대안. 이 셋이 갖춰지면 거절은 관계를 상하게 하지 않는다. 오히려 다음 부탁을 쉽게 만든다.',
        '거절이 어려운 이유는 대개 상대 때문이 아니라 나 때문이다. 좋은 사람으로 남고 싶은 마음이, 좋은 관계를 만드는 일을 방해한다.',
      ] },
    { title: '2. 경계는 벽이 아니라 문이다',
      body: [
        '경계를 세운다는 말은 관계를 끊는다는 뜻이 아니다. 담장 없는 집에는 손님이 오지 않는다. 어디까지가 마당이고 어디부터가 거실인지 모르기 때문이다. 문이 있는 집이 손님을 더 잘 맞이하듯, 경계가 있는 사람이 관계를 더 오래 지킨다.',
        '경계는 선언이 아니라 반복으로 세워진다. 한 번의 큰 선언보다, 작은 요청에 일관되게 반응하는 편이 낫다. "퇴근 후에는 답장이 늦어요"를 열 번 지키는 것이, "연락하지 마세요"를 한 번 말하는 것보다 강하다.',
      ] },
    { title: '3. 관계를 남기는 말투',
      body: [
        '같은 거절도 말투에 따라 관계를 남기기도, 끝내기도 한다. 원칙은 하나다. 내용은 단호하게, 형식은 다정하게.',
        '단호한 내용이 없으면 거절이 아니라 흥정이 되고, 다정한 형식이 없으면 거절이 아니라 단절이 된다. 이 둘은 반대말이 아니라 한 문장의 앞뒤다.',
        '연습할 문장은 짧다. "마음 써줘서 고마워요. 이번에는 어려워요." 이 두 문장 사이에 변명을 넣지 않는 것이 연습의 전부다.',
      ] },
  ],
};

let cur = 0;
let fs = 1;
const $ = id => document.getElementById(id);

function render(){
  const n = BOOK.chapters.length, c = BOOK.chapters[cur];
  $('pageNo').textContent = `${BOOK.title} — ${cur+1} / ${n}`;
  $('pageTitle').textContent = c.title;
  $('pageBody').innerHTML = c.body.map(p=>`<p>${p}</p>`).join('');
  $('pos').textContent = `${cur+1} / ${n}`;
  $('prevBtn').disabled = cur === 0;
  $('nextBtn').disabled = cur === n-1;
  $('pbar').style.width = `${((cur+1)/n)*100}%`;
  $('tocList').innerHTML = BOOK.chapters.map((ch,i)=>
    `<button class="toc-i${i===cur?' on':''}" onclick="goto(${i})">
       <span class="no">${String(i+1).padStart(2,'0')}</span><span>${ch.title}</span>
     </button>`).join('');
  $('read').scrollTop = 0;
}
function goto(i){ cur = i; render(); toggleToc(false); }
function move(d){
  const i = cur + d;
  if(i < 0 || i >= BOOK.chapters.length) return;
  cur = i; render();
}
function toggleToc(force){
  const toc = $('toc');
  const open = typeof force === 'boolean' ? force : !toc.classList.contains('open');
  toc.classList.toggle('open', open);
  $('tocBtn').setAttribute('aria-pressed', String(open));
}
function fontSize(d){
  fs = Math.max(0, Math.min(2, fs + d));
  document.body.dataset.fs = fs;
}
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowLeft') move(-1);
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'Escape') toggleToc(false);
});
render();
</script>
</body>
</html>
